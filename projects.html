,"Samui","Samui","iSEE","iSEE","iSEE","iSEE","iSEE"]},{"Region":["ERC","ERC"],"FullTitle":["APOE E4 Alzheimer’s Risk Converges on an Oligodendrocyte Subtype in the Human Entorhinal Cortex","APOE E4 Alzheimer’s Risk Converges on an Oligodendrocyte Subtype in the Human Entorhinal Cortex"],"project_id":["erc2026","erc2026"],"Title1":["snRNA-Seq ERC","Spatial ERC"],"Authors":["Louise A. Huuki-Myers, Heena R. Divecha, Svitlana V. Bach, Madeline R. Valentine, Nicholas J. Eagles, Bernard Mulvey, Rahul A. Bharadwaj, Ruth Zhang, James R. Evans, Melissa Grant-Peters, Ryan A. Miller, Joel E. Kleinman, Shizhong Han, Thomas M. Hyde, Stephanie C. Page, Daniel R. Weinberger, Keri Martinowich, Mina Ryten, Kristen R. Maynard, Leonardo Collado-Torres","Louise A. Huuki-Myers, Heena R. Divecha, Svitlana V. Bach, Madeline R. Valentine, Nicholas J. Eagles, Bernard Mulvey, Rahul A. Bharadwaj, Ruth Zhang, James R. Evans, Melissa Grant-Peters, Ryan A. Miller, Joel E. Kleinman, Shizhong Han, Thomas M. Hyde, Stephanie C. Page, Daniel R. Weinberger, Keri Martinowich, Mina Ryten, Kristen R. Maynard, Leonardo Collado-Torres"],"Year":[2026,2026],"Summary":["The entorhinal cortex (ERC) is implicated in early progression of Alzheimer’s disease (AD). Here we investigated the impact of established biological risk factors for AD, including APOE genotype (E2 versus E4 alleles), sex, and ancestry, on gene expression in the human ERC. We generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA sequencing data (snRNA-seq) in postmortem human ERC tissue from middle aged brain donors with no history of AD. APOE-dependent changes in gene expression predominantly mapped to a transcriptionally-defined oligodendrocyte subtype, which varied substantially with ancestry, and suggested differences in oligodendrocyte differentiation and myelination. Integration of SRT and snRNA-seq data identified a common gene expression signature associated with APOE genotype, which we localized to the same oligodendrocyte subtype and a white matter spatial domain. This suggests that AD risk in ERC may be associated with disrupted oligodendrocyte function, potentially contributing to future neurodegeneration.","The entorhinal cortex (ERC) is implicated in early progression of Alzheimer’s disease (AD). Here we investigated the impact of established biological risk factors for AD, including APOE genotype (E2 versus E4 alleles), sex, and ancestry, on gene expression in the human ERC. We generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA sequencing data (snRNA-seq) in postmortem human ERC tissue from middle aged brain donors with no history of AD. APOE-dependent changes in gene expression predominantly mapped to a transcriptionally-defined oligodendrocyte subtype, which varied substantially with ancestry, and suggested differences in oligodendrocyte differentiation and myelination. Integration of SRT and snRNA-seq data identified a common gene expression signature associated with APOE genotype, which we localized to the same oligodendrocyte subtype and a white matter spatial domain. This suggests that AD risk in ERC may be associated with disrupted oligodendrocyte function, potentially contributing to future neurodegeneration."],"DOI":["10.1101/2025.11.20.689483 ","10.1101/2025.11.20.689483 "],"Link2App":["https://interactive.libd.org/LFF_ERC_iSEE-app/","https://interactive.libd.org/LFF_ERC_Visium/"],"GitHub":["LFF_spatial_ERC","LFF_spatial_ERC"],"dataType":["snRNA-seq","spatial"],"dx":["Alzheimer's disease","Alzheimer's disease"],"species":["Human","Human"],"AppType":["iSEE","spatialLIBD"]},{"Region":["HPC","HPC","HPC"],"FullTitle":["An integrated single-nucleus and spatial transcriptomics atlas reveals the molecular landscape of the human hippocampus","An integrated single-nucleus and spatial transcriptomics atlas reveals the molecular landscape of the human hippocampus","An integrated single-nucleus and spatial transcriptomics atlas reveals the molecular landscape of the human hippocampus"],"project_id":["hpc2025","hpc2025","hpc2025"],"Title1":["spatial HPC - pseudobulk","spatial HPC","snRNA-Seq HPC"],"Authors":["Jacqueline R. Thompson, Erik D. Nelson, Madhavi Tippani, Anthony D. Ramnauth, Heena R. Divecha, Ryan A. Miller, Nicholas J. Eagles, Elizabeth A. Pattie, Sang Ho Kwon, Svitlana V. Bach, Uma M. Kaipa, Jianing Yao, Christine Hou, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Kristen R. Maynard, Thomas M. Hyde, Keri Martinowich, Stephanie C. Page & Stephanie C. Hicks ","Jacqueline R. Thompson, Erik D. Nelson, Madhavi Tippani, Anthony D. Ramnauth, Heena R. Divecha, Ryan A. Miller, Nicholas J. Eagles, Elizabeth A. Pattie, Sang Ho Kwon, Svitlana V. Bach, Uma M. Kaipa, Jianing Yao, Christine Hou, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Kristen R. Maynard, Thomas M. Hyde, Keri Martinowich, Stephanie C. Page & Stephanie C. Hicks ","Jacqueline R. Thompson, Erik D. Nelson, Madhavi Tippani, Anthony D. Ramnauth, Heena R. Divecha, Ryan A. Miller, Nicholas J. Eagles, Elizabeth A. Pattie, Sang Ho Kwon, Svitlana V. Bach, Uma M. Kaipa, Jianing Yao, Christine Hou, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Kristen R. Maynard, Thomas M. Hyde, Keri Martinowich, Stephanie C. Page & Stephanie C. Hicks "],"Year":[2025,2025,2025],"Summary":["Cell types in the hippocampus with unique morphology, physiology and connectivity serve specialized functions associated with cognition and mood. These cell types are spatially organized, necessitating molecular profiling strategies that retain cytoarchitectural organization. Here we generated spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from anterior human hippocampus in ten adult neurotypical donors. Using non-negative matrix factorization (NMF) and label transfer, we integrated these data by defining gene expression patterns within the snRNA-seq data and then inferring expression in the SRT data. These patterns captured transcriptional variation across neuronal cell types and indicated spatial organization of excitatory and inhibitory postsynaptic specializations. Leveraging the NMF and label transfer approach with rodent datasets, we identified putative patterns of activity-dependent transcription and circuit connectivity in the human SRT dataset. Finally, we characterized the spatial organization of NMF patterns corresponding to pyramidal neurons and identified regionally-specific snRNA-seq clusters of the retrohippocampus, subiculum and presubiculum. To make this molecular atlas widely accessible, raw and processed data are freely available, including through interactive web applications.","Cell types in the hippocampus with unique morphology, physiology and connectivity serve specialized functions associated with cognition and mood. These cell types are spatially organized, necessitating molecular profiling strategies that retain cytoarchitectural organization. Here we generated spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from anterior human hippocampus in ten adult neurotypical donors. Using non-negative matrix factorization (NMF) and label transfer, we integrated these data by defining gene expression patterns within the snRNA-seq data and then inferring expression in the SRT data. These patterns captured transcriptional variation across neuronal cell types and indicated spatial organization of excitatory and inhibitory postsynaptic specializations. Leveraging the NMF and label transfer approach with rodent datasets, we identified putative patterns of activity-dependent transcription and circuit connectivity in the human SRT dataset. Finally, we characterized the spatial organization of NMF patterns corresponding to pyramidal neurons and identified regionally-specific snRNA-seq clusters of the retrohippocampus, subiculum and presubiculum. To make this molecular atlas widely accessible, raw and processed data are freely available, including through interactive web applications.","Cell types in the hippocampus with unique morphology, physiology and connectivity serve specialized functions associated with cognition and mood. These cell types are spatially organized, necessitating molecular profiling strategies that retain cytoarchitectural organization. Here we generated spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from anterior human hippocampus in ten adult neurotypical donors. Using non-negative matrix factorization (NMF) and label transfer, we integrated these data by defining gene expression patterns within the snRNA-seq data and then inferring expression in the SRT data. These patterns captured transcriptional variation across neuronal cell types and indicated spatial organization of excitatory and inhibitory postsynaptic specializations. Leveraging the NMF and label transfer approach with rodent datasets, we identified putative patterns of activity-dependent transcription and circuit connectivity in the human SRT dataset. Finally, we characterized the spatial organization of NMF patterns corresponding to pyramidal neurons and identified regionally-specific snRNA-seq clusters of the retrohippocampus, subiculum and presubiculum. To make this molecular atlas widely accessible, raw and processed data are freely available, including through interactive web applications."],"DOI":["10.1038/s41593-025-02022-0","10.1038/s41593-025-02022-0","10.1038/s41593-025-02022-0"],"Link2App":["https://interactive.libd.org/pseudobulk_HPC/","https://samuibrowser.com/from?url=data.libd.org/samuibrowser/&s=Br3942&s=Br8325&s=Br2720&s=Br2743&s=Br3942-VSPG&s=Br6423&s=Br6432&s=Br6471&s=Br6522&s=Br8325-VSPG&s=Br8492&s=Br8667","https://interactive.libd.org/HPC_snRNAseq_data/"],"GitHub":["spatial_hpc","spatial_hpc","spatial_hpc"],"dataType":["spatial","spatial","snRNA-seq"],"dx":["neurotypical","neurotypical","neurotypical"],"species":["Human","Human","Human"],"AppType":["iSEE","Samui","iSEE"]},{"Region":["HYP","HYP"],"FullTitle":["Spatially-resolved molecular sex differences at single cell resolution in the adult human ventromedial and arcuate hypothalamus","Spatially-resolved molecular sex differences at single cell resolution in the adult human ventromedial and arcuate hypothalamus"],"project_id":["hyp2026","hyp2026"],"Title1":["spatial HYP: Visium","spatial HYP: Xenium"],"Authors":["Bernard Mulvey, Yi Wang, Heena R. Divecha, Svitlana V. Bach, Kelsey D. Montgomery, Sophia Cinquemani, Atharv Chandra, Yufeng Du, Ryan A. Miller, Joel E. Kleinman, Stephanie C. Page, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Kasper D. Hansen, Kristen R. Maynard","Bernard Mulvey, Yi Wang, Heena R. Divecha, Svitlana V. Bach, Kelsey D. Montgomery, Sophia Cinquemani, Atharv Chandra, Yufeng Du, Ryan A. Miller, Joel E. Kleinman, Stephanie C. Page, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Kasper D. Hansen, Kristen R. Maynard"],"Year":[2026,2026],"Summary":["The hypothalamus contains multiple regions, including the ventromedial hypothalamus (VMH) and arcuate (ARC), which are responsible for sex-differentiated functions such as endocrine signaling, metabolism, and reproductive behaviors. While molecular, anatomic, and sex-differentiated features of the rodent hypothalamus are well established, much less is known about these regions in humans. Here, we provide a spatially resolved single-cell atlas of sex-differentially expressed (sex-DE) genes in the human ARC and VMH. We identify neuronal populations governing hypothalamus-specific functions, define their spatial distributions, and show enrichment of sex-DE in retinoid metabolism- and retinoid receptor-regulated genes. Within the ARC and VMH, we find correlated autosomal expression differences localized to ESR1/TAC3-expressing and corticotropin-releasing hormone receptor 2 (CRHR2)-expressing neurons and extensive sex-DE genes linked to sex-biased disorders, including autism, depression, and schizophrenia. Our molecular mapping of disease associations to hypothalamic cell types with established roles in sex-divergent physiology and behavior provides insights into the mechanistic bases of sex bias in neurodevelopmental and neuropsychiatric disorders.","The hypothalamus contains multiple regions, including the ventromedial hypothalamus (VMH) and arcuate (ARC), which are responsible for sex-differentiated functions such as endocrine signaling, metabolism, and reproductive behaviors. While molecular, anatomic, and sex-differentiated features of the rodent hypothalamus are well established, much less is known about these regions in humans. Here, we provide a spatially resolved single-cell atlas of sex-differentially expressed (sex-DE) genes in the human ARC and VMH. We identify neuronal populations governing hypothalamus-specific functions, define their spatial distributions, and show enrichment of sex-DE in retinoid metabolism- and retinoid receptor-regulated genes. Within the ARC and VMH, we find correlated autosomal expression differences localized to ESR1/TAC3-expressing and corticotropin-releasing hormone receptor 2 (CRHR2)-expressing neurons and extensive sex-DE genes linked to sex-biased disorders, including autism, depression, and schizophrenia. Our molecular mapping of disease associations to hypothalamic cell types with established roles in sex-divergent physiology and behavior provides insights into the mechanistic bases of sex bias in neurodevelopmental and neuropsychiatric disorders."],"DOI":["10.1016/j.celrep.2025.116877","10.1016/j.celrep.2025.116877"],"Link2App":["https://samuibrowser.com/from?url=data.libd.org/samuibrowser/&s=V12D05-348_C1&s=V12D05-348_D1&s=V12D05-350_C1&s=V12D05-350_D1&s=V12D07-075_A1&s=V12D07-075_D1&s=V12Y31-080_A1&s=V13M13-362_A1&s=V13M13-362_D1&s=V13Y24-346_C1","https://samuibrowser.com/from?url=data.libd.org/samuibrowser/&s=X36_5459A&s=X36_5459B&s=X36_8667C&s=X86_reg1&s=X86_reg2&s=X86_reg3&s=X97_reg1&s=X97_reg2&s=X97_reg3&s=X99_1225A&s=X99_1225B&s=X99_8741C&s=X99_8741D"],"GitHub":["spatial_HYP","spatial_HYP"],"dataType":["spatial","spatial"],"dx":["neurotypical","neurotypical"],"species":["Human","Human"],"AppType":["Samui","Xenium"]},{"Region":["LC"],"FullTitle":["Impact of Alzheimer’s disease risk factors and local neuromelanin content on the transcriptomic landscape of the human locus coeruleus"],"project_id":["lc2026"],"Title1":["Spatial LC"],"Authors":["Bernard Mulvey, Heena R. Divecha, Madhavi Tippani, Svitlana V. Bach, Rahul Bharadwaj, Ishbel Del Rosario, Sarah E. Maguire, Ryan A. Miller, Aaron J. Salisbury, Atharv Chandra, Beau A. Oster, Kelsey D. Montgomery, Sang Ho Kwon, Haya A. Algrain, Alexis R. Papariello, Louise A. Huuki-Myers, Joel E. Kleinman, Leonardo Collado-Torres, Thomas M. Hyde, Shizhong Han, Stephanie C. Hicks, Daniel R. Weinberger, Stephanie C. Page, Kristen R. Maynard, Keri Martinowich"],"Year":[2026],"Summary":["The locus coeruleus (LC) is a small noradrenergic nucleus in the dorsal pons that sends projections across the brain regulating sleep, arousal, attention, stress responses, and some forms of cognition. LC neurons show pathology in the earliest stages of Alzheimer’s disease (AD), including age-related accumulation of hyperphosphorylated tau (pTau) and accelerated loss of neuromelanin (NM) pigmentation. NM-sensitive neuroimaging of the LC predicts previous cognitive decline, clinical severity, and future AD progression. While these findings suggest that the LC plays an etiologic role in AD, the molecular landscape of the LC prior to clinical manifestation of sporadic AD remains largely uncharacterized. This information is critical for developing interventions that preserve LC integrity and function. We performed spatially-resolved transcriptomics on 85 sections of human postmortem LC from N=33 neurotypical middle-aged donors, balanced for epidemiologic AD risk factors including sex, African or European ancestry, and APOE genotype (carriers of the E4/risk or E2/protective alleles). Comparing across APOE genotypes, we find astrocytic gene expression differences proximal to LC neurons. Associating NM content with local gene expression, we show that higher overall APOE gene expression correlates with reduced NM content and an enrichment of NM-associated genes in aging pathways. Unexpectedly, we find enriched LC expression of cholesterol synthesis genes, alongside evidence for lipid synthesis gene regulatory network activity in NM-containing LC specifically, revealing a potential intersection between intrinsic lipid metabolism in LC neurons, NM, and the role of APOE-mediated lipid biology in AD. Together, these data illuminate the molecular features of the human LC at spatial resolution with unprecedented sampling depth, revealing how AD risk factors and NM content influence resilience and susceptibility of this critical brain nucleus to pathology accumulation and degeneration."],"DOI":["10.1101/2025.10.29.685354"],"Link2App":["https://interactive.libd.org/LFF_spatial_LC/"],"GitHub":["LFF_spatial_LC"],"dataType":["spatial"],"dx":["Alzheimer's disease"],"species":["Human"],"AppType":["spatialLIBD"]},{"Region":["LS","LS"],"FullTitle":["TrkB-dependent regulation of molecular signaling across septal cell types","TrkB-dependent regulation of molecular signaling across septal cell types"],"project_id":["ls2024","ls2024"],"Title1":["septum_lateral","septum_lateral"],"Authors":["Lionel A. Rodriguez, Matthew Nguyen Tran, Renee Garcia-Flores, Seyun Oh, Robert A. Phillips III, Elizabeth A. Pattie, Heena R. Divecha, Sun Hong Kim, Joo Heon Shin, Yong Kyu Lee, Carly Montoya, Andrew E. Jaffe, Leonardo Collado-Torres, Stephanie C. Page & Keri Martinowich ","Lionel A. Rodriguez, Matthew Nguyen Tran, Renee Garcia-Flores, Seyun Oh, Robert A. Phillips III, Elizabeth A. Pattie, Heena R. Divecha, Sun Hong Kim, Joo Heon Shin, Yong Kyu Lee, Carly Montoya, Andrew E. Jaffe, Leonardo Collado-Torres, Stephanie C. Page & Keri Martinowich "],"Year":[2024,2024],"Summary":["The lateral septum (LS), a GABAergic structure located in the basal forebrain, is implicated in social behavior, learning, and memory. We previously demonstrated that expression of tropomyosin kinase receptor B (TrkB) in LS neurons is required for social novelty recognition. To better understand molecular mechanisms by which TrkB signaling controls behavior, we locally knocked down TrkB in LS and used bulk RNA-sequencing to identify changes in gene expression downstream of TrkB. TrkB knockdown induces upregulation of genes associated with inflammation and immune responses, and downregulation of genes associated with synaptic signaling and plasticity. Next, we generated one of the first atlases of molecular profiles for LS cell types using single nucleus RNA-sequencing (snRNA-seq). We identified markers for the septum broadly, and the LS specifically, as well as for all neuronal cell types. We then investigated whether the differentially expressed genes (DEGs) induced by TrkB knockdown map to specific LS cell types. Enrichment testing identified that downregulated DEGs are broadly expressed across neuronal clusters. Enrichment analyses of these DEGs demonstrated that downregulated genes are uniquely expressed in the LS, and associated with either synaptic plasticity or neurodevelopmental disorders. Upregulated genes are enriched in LS microglia, associated with immune response and inflammation, and linked to both neurodegenerative disease and neuropsychiatric disorders. In addition, many of these genes are implicated in regulating social behaviors. In summary, the findings implicate TrkB signaling in the LS as a critical regulator of gene networks associated with psychiatric disorders that display social deficits, including schizophrenia and autism, and with neurodegenerative diseases, including Alzheimer’s.","The lateral septum (LS), a GABAergic structure located in the basal forebrain, is implicated in social behavior, learning, and memory. We previously demonstrated that expression of tropomyosin kinase receptor B (TrkB) in LS neurons is required for social novelty recognition. To better understand molecular mechanisms by which TrkB signaling controls behavior, we locally knocked down TrkB in LS and used bulk RNA-sequencing to identify changes in gene expression downstream of TrkB. TrkB knockdown induces upregulation of genes associated with inflammation and immune responses, and downregulation of genes associated with synaptic signaling and plasticity. Next, we generated one of the first atlases of molecular profiles for LS cell types using single nucleus RNA-sequencing (snRNA-seq). We identified markers for the septum broadly, and the LS specifically, as well as for all neuronal cell types. We then investigated whether the differentially expressed genes (DEGs) induced by TrkB knockdown map to specific LS cell types. Enrichment testing identified that downregulated DEGs are broadly expressed across neuronal clusters. Enrichment analyses of these DEGs demonstrated that downregulated genes are uniquely expressed in the LS, and associated with either synaptic plasticity or neurodevelopmental disorders. Upregulated genes are enriched in LS microglia, associated with immune response and inflammation, and linked to both neurodegenerative disease and neuropsychiatric disorders. In addition, many of these genes are implicated in regulating social behaviors. In summary, the findings implicate TrkB signaling in the LS as a critical regulator of gene networks associated with psychiatric disorders that display social deficits, including schizophrenia and autism, and with neurodegenerative diseases, including Alzheimer’s."],"DOI":["10.1038/s41398-024-02758-6","10.1038/s41398-024-02758-6"],"Link2App":["https://interactive.libd.org/snRNAseq_lateral_septum/","https://interactive.libd.org/bulkseq_lateral_septum/"],"GitHub":["septum_lateral","septum_lateral"],"dataType":["snRNA-seq","bulk RNA-seq"],"dx":["wild type","wild type"],"species":["Mouse","Mouse"],"AppType":["iSEE","iSEE"]},{"Region":["NAc","NAc"],"FullTitle":["Spatiomolecular mapping reveals anatomical organization of heterogeneous cell types in the human nucleus accumbens","Spatiomolecular mapping reveals anatomical organization of heterogeneous cell types in the human nucleus accumbens"],"project_id":["nac2026","nac2026"],"Title1":["Spatial NAc","snRNA-Seq NAc"],"Authors":["Prashanthi Ravichandran, Svitlana V. Bach, Robert A. Phillips, III, Madeline R. Valentine, Nicholas J. Eagles, Yufeng Du, Ishbel del Rosario, Haya A. AlGrain, Sarah E. Maguire, Ryan A. Miller, Heena R. Divecha, Madhavi Tippani, Kelsey D. Montgomery, Joel E. Kleinman, Shizhong Han, Stephanie C. Page, Thomas M. Hyde, Leonardo Collado-Torres, Alexis Battle, Keri Martinowich, Stephanie C. Hicks, Kristen R. Maynard","Prashanthi Ravichandran, Svitlana V. Bach, Robert A. Phillips, III, Madeline R. Valentine, Nicholas J. Eagles, Yufeng Du, Ishbel del Rosario, Haya A. AlGrain, Sarah E. Maguire, Ryan A. Miller, Heena R. Divecha, Madhavi Tippani, Kelsey D. Montgomery, Joel E. Kleinman, Shizhong Han, Stephanie C. Page, Thomas M. Hyde, Leonardo Collado-Torres, Alexis Battle, Keri Martinowich, Stephanie C. Hicks, Kristen R. Maynard"],"Year":[2026,2026],"Summary":["The nucleus accumbens (NAc) is a key component of the mesolimbic dopamine system that is implicated in several neuropsychiatric disorders. The NAc contains transcriptomically distinct medium spiny neuron (MSN) subtypes, but their spatial organization remains unclear. We generated a spatiomolecular atlas of the human NAc by integrating paired single-cell and spatial transcriptomics of postmortem NAc tissue. We identified transcriptionally unique cell populations and spatial domains (SpDs), including D1 islands composed of discrete MSN subtypes enriched for dopamine receptor D1 (DRD1) and OPRM1. We demonstrated continuous spatial gene expression gradients across the NAc and evolutionary conservation of spatial features. We also identified SpDs associated with risk for psychiatric and addiction-related traits and spatially mapped risk-associated ligand-receptor interactions. Finally, we predicted enrichment of drug-responsive transcriptional programs in both SpDs and cell types. Collectively, we provide a spatiomolecular framework for understanding the relevance of the human NAc in neuropsychiatric diseases.","The nucleus accumbens (NAc) is a key component of the mesolimbic dopamine system that is implicated in several neuropsychiatric disorders. The NAc contains transcriptomically distinct medium spiny neuron (MSN) subtypes, but their spatial organization remains unclear. We generated a spatiomolecular atlas of the human NAc by integrating paired single-cell and spatial transcriptomics of postmortem NAc tissue. We identified transcriptionally unique cell populations and spatial domains (SpDs), including D1 islands composed of discrete MSN subtypes enriched for dopamine receptor D1 (DRD1) and OPRM1. We demonstrated continuous spatial gene expression gradients across the NAc and evolutionary conservation of spatial features. We also identified SpDs associated with risk for psychiatric and addiction-related traits and spatially mapped risk-associated ligand-receptor interactions. Finally, we predicted enrichment of drug-responsive transcriptional programs in both SpDs and cell types. Collectively, we provide a spatiomolecular framework for understanding the relevance of the human NAc in neuropsychiatric diseases."],"DOI":["10.1101/2025.09.10.675374 ","10.1101/2025.09.10.675374 "],"Link2App":["https://interactive.libd.org/Spatial_NAc/","https://interactive.libd.org/snRNAseq_NAc/"],"GitHub":["spatial_NAc","spatial_NAc"],"dataType":["spatial","snRNA-seq"],"dx":["neurotypical","neurotypical"],"species":["Human","Human"],"AppType":["spatialLIBD","iSEE"]},{"Region":["DLPFC"],"FullTitle":["Transcriptome-scale spatial gene expression in the human dorsolateral prefrontal cortex"],"project_id":["spatialLIBD2021"],"Title1":["spatial LIBD"],"Authors":["Kristen R Maynard, Leonardo Collado-Torres, Lukas M Weber, Cedric Uytingco, Brianna K Barry, Stephen R Williams, Joseph L Catallini II, Matthew N Tran, Zachary Besich, Madhavi Tippani, Jennifer Chew, Yifeng Yin, Joel E Kleinman, Thomas M Hyde, Nikhil Rao, Stephanie C Hicks, Keri Martinowich, Andrew E Jaffe"],"Year":[2021],"Summary":["We used the 10x Genomics Visium platform to define the spatial topography of gene expression in the six-layered human dorsolateral prefrontal cortex (DLPFC). We identified extensive layer-enriched expression signatures, and refined associations to previous laminar markers. We overlaid our laminar expression signatures onto large-scale single nuclei RNA sequencing data, enhancing spatial annotation of expression-driven clusters. By integrating neuropsychiatric disorder gene sets, we showed differential layer-enriched expression of genes associated with schizophrenia and autism spectrum disorder, highlighting the clinical relevance of spatially-defined expression. We then developed a data-driven framework to define unsupervised clusters in spatial transcriptomics data, which can be applied to other tissues or brain regions where morphological architecture is not as well-defined as cortical laminae. We lastly created a web application for the scientific community to explore these raw and summarized data to augment ongoing neuroscience and spatial transcriptomics research."],"DOI":["10.1038/s41593-020-00787-0"],"Link2App":["https://interactive.libd.org/spatialLIBD/"],"GitHub":["spatialLIBD"],"dataType":["spatial"],"dx":["neurotypical"],"species":["Human"],"AppType":["spatialLIBD"]},{"Region":["AMY","DLPFC","HPC","NAc","sACC"],"FullTitle":["Single-nucleus transcriptome analysis reveals cell-type-specific molecular signatures across reward circuitry in the human brain","Single-nucleus transcriptome analysis reveals cell-type-specific molecular signatures across reward circuitry in the human brain","Single-nucleus transcriptome analysis reveals cell-type-specific molecular signatures across reward circuitry in the human brain","Single-nucleus transcriptome analysis reveals cell-type-specific molecular signatures across reward circuitry in the human brain","Single-nucleus transcriptome analysis reveals cell-type-specific molecular signatures across reward circuitry in the human brain"],"project_id":["tran2021","tran2021","tran2021","tran2021","tran2021"],"Title1":["tran2021 - AMY","tran2021 - DLPFC","tran2021 - HPC","tran2021 - NAc","tran2021 - sACC"],"Authors":["Matthew N. Tran, Kristen R. Maynard, Abby Spangler, Louise A. Huuki, Kelsey D. Montgomery, Vijay Sadashivaiah, Madhavi Tippani, Brianna K. Barry, Dana B. Hancock, Stephanie C. Hicks, Joel E. Kleinman, Thomas M. Hyde, Leonardo Collado-Torres, Andrew E. Jaffe, Keri Martinowich","Matthew N. Tran, Kristen R. Maynard, Abby Spangler, Louise A. Huuki, Kelsey D. Montgomery, Vijay Sadashivaiah, Madhavi Tippani, Brianna K. Barry, Dana B. Hancock, Stephanie C. Hicks, Joel E. Kleinman, Thomas M. Hyde, Leonardo Collado-Torres, Andrew E. Jaffe, Keri Martinowich","Matthew N. Tran, Kristen R. Maynard, Abby Spangler, Louise A. Huuki, Kelsey D. Montgomery, Vijay Sadashivaiah, Madhavi Tippani, Brianna K. Barry, Dana B. Hancock, Stephanie C. Hicks, Joel E. Kleinman, Thomas M. Hyde, Leonardo Collado-Torres, Andrew E. Jaffe, Keri Martinowich","Matthew N. Tran, Kristen R. Maynard, Abby Spangler, Louise A. Huuki, Kelsey D. Montgomery, Vijay Sadashivaiah, Madhavi Tippani, Brianna K. Barry, Dana B. Hancock, Stephanie C. Hicks, Joel E. Kleinman, Thomas M. Hyde, Leonardo Collado-Torres, Andrew E. Jaffe, Keri Martinowich","Matthew N. Tran, Kristen R. Maynard, Abby Spangler, Louise A. Huuki, Kelsey D. Montgomery, Vijay Sadashivaiah, Madhavi Tippani, Brianna K. Barry, Dana B. Hancock, Stephanie C. Hicks, Joel E. Kleinman, Thomas M. Hyde, Leonardo Collado-Torres, Andrew E. Jaffe, Keri Martinowich"],"Year":[2021,2021,2021,2021,2021],"Summary":["Single-cell gene expression technologies are powerful tools to study cell types in the human brain, but efforts have largely focused on cortical brain regions. We therefore created a single-nucleus RNA-sequencing resource of 70,615 high-quality nuclei to generate a molecular taxonomy of cell types across five human brain regions that serve as key nodes of the human brain reward circuitry: nucleus accumbens, amygdala, subgenual anterior cingulate cortex, hippocampus, and dorsolateral prefrontal cortex. We first identified novel subpopulations of interneurons and medium spiny neurons (MSNs) in the nucleus accumbens and further characterized robust GABAergic inhibitory cell populations in the amygdala. Joint analyses across the 107 reported cell classes revealed cell-type substructure and unique patterns of transcriptomic dynamics. We identified discrete subpopulations of D1- and D2-expressing MSNs in the nucleus accumbens to which we mapped cell-type-specific enrichment for genetic risk associated with both psychiatric disease and addiction.","Single-cell gene expression technologies are powerful tools to study cell types in the human brain, but efforts have largely focused on cortical brain regions. We therefore created a single-nucleus RNA-sequencing resource of 70,615 high-quality nuclei to generate a molecular taxonomy of cell types across five human brain regions that serve as key nodes of the human brain reward circuitry: nucleus accumbens, amygdala, subgenual anterior cingulate cortex, hippocampus, and dorsolateral prefrontal cortex. We first identified novel subpopulations of interneurons and medium spiny neurons (MSNs) in the nucleus accumbens and further characterized robust GABAergic inhibitory cell populations in the amygdala. Joint analyses across the 107 reported cell classes revealed cell-type substructure and unique patterns of transcriptomic dynamics. We identified discrete subpopulations of D1- and D2-expressing MSNs in the nucleus accumbens to which we mapped cell-type-specific enrichment for genetic risk associated with both psychiatric disease and addiction.","Single-cell gene expression technologies are powerful tools to study cell types in the human brain, but efforts have largely focused on cortical brain regions. We therefore created a single-nucleus RNA-sequencing resource of 70,615 high-quality nuclei to generate a molecular taxonomy of cell types across five human brain regions that serve as key nodes of the human brain reward circuitry: nucleus accumbens, amygdala, subgenual anterior cingulate cortex, hippocampus, and dorsolateral prefrontal cortex. We first identified novel subpopulations of interneurons and medium spiny neurons (MSNs) in the nucleus accumbens and further characterized robust GABAergic inhibitory cell populations in the amygdala. Joint analyses across the 107 reported cell classes revealed cell-type substructure and unique patterns of transcriptomic dynamics. We identified discrete subpopulations of D1- and D2-expressing MSNs in the nucleus accumbens to which we mapped cell-type-specific enrichment for genetic risk associated with both psychiatric disease and addiction.","Single-cell gene expression technologies are powerful tools to study cell types in the human brain, but efforts have largely focused on cortical brain regions. We therefore created a single-nucleus RNA-sequencing resource of 70,615 high-quality nuclei to generate a molecular taxonomy of cell types across five human brain regions that serve as key nodes of the human brain reward circuitry: nucleus accumbens, amygdala, subgenual anterior cingulate cortex, hippocampus, and dorsolateral prefrontal cortex. We first identified novel subpopulations of interneurons and medium spiny neurons (MSNs) in the nucleus accumbens and further characterized robust GABAergic inhibitory cell populations in the amygdala. Joint analyses across the 107 r ["Human","Baboon","Macaque"],"GitHub":["BLA_crossSpecies","BLA_crossSpecies","BLA_crossSpecies"],"dataType":["spatial","spatial","spatial"],"Region":["BLA","BLA","BLA"]},"columns":[{"id":"Link2App","name":"App Link","type":"character","cell":[{"name":"a","attribs":{"href":"https://interactive.libd.org/BLA_Human/","target":"_blank"},"children":["Spatial BLA - Human: spatialLIBD"]},{"name":"a","attribs":{"href":"https://interactive.libd.org/BLA_Baboon/","target":"_blank"},"children":["Spatial BLA - Baboon: spatialLIBD"]},{"name":"a","attribs":{"href":"https://interactive.libd.org/BLA_Macaque/","target":"_blank"},"children":["Spatial BLA - Macaque: spatialLIBD"]}],"align":"center"},{"id":"Title1","name":"Title1","type":"character","show":false},{"id":"AppType","name":"AppType","type":"character","show":false},{"id":"species","name":"Species","type":"character","align":"center"},{"id":"GitHub","name":"GitHub","type":"character","show":false,"cell":[{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/BLA_crossSpecies","target":"_blank"},"children":["BLA_crossSpecies"]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/BLA_crossSpecies","target":"_blank"},"children":["BLA_crossSpecies"]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/BLA_crossSpecies","target":"_blank"},"children":["BLA_crossSpecies"]}]},{"id":"dataType","name":"Data Type","type":"character","align":"center"},{"id":"Region","name":"Region","type":"character","align":"center"}],"highlight":true,"compact":true,"dataKey":"34ce7041d7838184fb86f54150ba99bc","static":false,"nested":true},"children":[]},{"name":"hr","attribs":{"style":{"margin":"1.5rem 0","border-top":"1px solid #ddd"}},"children":[]},{"name":"div","attribs":{"style":{"line-height":"1.6"}},"children":[{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Summary: "]},{"name":"span","attribs":{},"children":["The amygdaloid complex mediates learning, memory, and emotions. Understanding cellular and anatomical features specialized in the primate amygdala versus other mammals requires a systematic, anatomically resolved molecular analysis of neuron types. We analyzed five nuclear subdivisions of the primate amygdala with single-nucleus RNA sequencing in macaques, baboons, and humans to examine gene expression profiles for excitatory and inhibitory neurons. Integrated analyses across species identified diverse subtypes of glutamatergic and GABAergic neurons that are highly conserved across primates. Compositional analyses revealed that subdivisions of the primate basolateral complex contain distinct classes of glutamatergic neurons and divergent gene expression profiles for parvalbumin and somatostatin GABAergic neurons. Referencing primate neuron types to transcriptomic atlases of the murine amygdala highlighted primate-specific specializations for glutamatergic neurons and identified which neuron types are conserved across mammals and amygdalar subdivisions. Understanding the molecular heterogeneity of anatomically resolved amygdalar neuron types provides a cellular framework for improving models of how amygdalar circuits contribute to cognition and mental health."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Michael S. Totty, Rita Cervera Juanes, Svitlana V. Bach, Lamya Ben Ameur, Madeline R. Valentine, Evan Simons, McKenna D. Romac, Hoa Trinh, Krystal Henderson, Ishbel Del Rosario, Madhavi Tippani, Ryan A. Miller, Joel E. Kleinman, Stephanie Cerceo Page, Arpiar Saunders, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Vincent D. Costa"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/BLA_crossSpecies","target":"_blanks"},"children":["BLA_crossSpecies"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["DOI: "]},{"name":"a","attribs":{"href":"https://doi.org/10.1126/sciadv.adw1029","target":"_blank"},"children":["10.1126/sciadv.adw1029"]}]}]}]},{"name":"div","attribs":{"style":{"padding":"1.5rem","background":"#f9f9f9","border":"1px solid #ddd","margin":"10px","border-radius":"8px"}},"children":[{"name":"h5","attribs":{"style":{"margin-top":"0","color":"#333"}},"children":["Project Resources"]},{"name":"Reactable","attribs":{"data":{"Link2App":["https://interactive.libd.org/spatialdACC_Visium/","https://interactive.libd.org/snRNAseq_dACC/"],"Title1":["Spatial dACC","snRNA-Seq dACC"],"AppType":["spatialLIBD","iSEE"],"species":["Human","Human"],"GitHub":["spatialdACC","spatialdACC"],"dataType":["spatial","snRNA-seq"],"Region":["dACC","dACC"]},"columns":[{"id":"Link2App","name":"App Link","type":"character","cell":[{"name":"a","attribs":{"href":"https://interactive.libd.org/spatialdACC_Visium/","target":"_blank"},"children":["Spatial dACC: spatialLIBD"]},{"name":"a","attribs":{"href":"https://interactive.libd.org/snRNAseq_dACC/","target":"_blank"},"children":["snRNA-Seq dACC: iSEE"]}],"align":"center"},{"id":"Title1","name":"Title1","type":"character","show":false},{"id":"AppType","name":"AppType","type":"character","show":false},{"id":"species","name":"Species","type":"character","align":"center"},{"id":"GitHub","name":"GitHub","type":"character","show":false,"cell":[{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatialdACC","target":"_blank"},"children":["spatialdACC"]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatialdACC","target":"_blank"},"children":["spatialdACC"]}]},{"id":"dataType","name":"Data Type","type":"character","align":"center"},{"id":"Region","name":"Region","type":"character","align":"center"}],"highlight":true,"compact":true,"dataKey":"74bd5d997282922d732c0ef3279ca726","static":false,"nested":true},"children":[]},{"name":"hr","attribs":{"style":{"margin":"1.5rem 0","border-top":"1px solid #ddd"}},"children":[]},{"name":"div","attribs":{"style":{"line-height":"1.6"}},"children":[{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Summary: "]},{"name":"span","attribs":{},"children":["In the human brain, the dorsal anterior cingulate cortex (dACC) plays key roles in various components of cognitive control, and is particularly relevant for reward processing and conflict monitoring. The dACC regulates expression of fear and pain, and its dysfunction is implicated in a number of neuropsychiatric disorders. Compared to more recently specialized neocortical areas, such as the dorsolateral prefrontal cortex (dlPFC), the dACC is evolutionarily older. The region’s agranular structure, and other evolutionary specializations, such as the presence of von Economo neurons (VENs), contribute to its specialized roles in cognitive and emotional processing. Here, we generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from adjacent tissue sections of the dACC in ten adult neurotypical donors to define molecular profiles for dACC cell types and spatial domains. Using non-negative matrix factorization (NMF), we integrated these data by identifying gene expression patterns within the snRNA-seq data, which were projected onto the SRT data to infer the spatial localization. Combining these data with publicly available resources, we revealed insights about molecular profiles, spatial topography, enrichment of disease risk, and putative connectivity of spatially-localized dACC cell types, including VENs. Utilizing published dlPFC snRNA-seq and SRT data collected in the same neurotypical brain donors used here, we deployed cross-region comparison analyses between dACC and dlPFC to understand spatio-molecular specializations and laminar organization across human brain evolution. To make this comprehensive molecular resource accessible to the scientific community, we made both raw and processed data freely available, including through interactive web applications."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Kinnary Shah, Michael S. Totty, Svitlana V. Bach, Madeline R. Valentine, Atharv Chandra, Heena R. Divecha, Ryan A. Miller, Sang Ho Kwon, Anthony D. Ramnauth, Madhavi Tippani, Sanjana Tyagi, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Thomas M. Hyde, Stephanie C. Page, Kristen R. Maynard, Stephanie C. Hicks, Keri Martinowich"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatialdACC","target":"_blanks"},"children":["spatialdACC"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["DOI: "]},{"name":"a","attribs":{"href":"https://doi.org/10.1101/2025.07.14.664821","target":"_blank"},"children":["10.1101/2025.07.14.664821"]}]}]}]},{"name":"div","attribs":{"style":{"padding":"1.5rem","background":"#f9f9f9","border":"1px solid #ddd","margin":"10px","border-radius":"8px"}},"children":[{"name":"h5","attribs":{"style":{"margin-top":"0","color":"#333"}},"children":["Project Resources"]},{"name":"Reactable","attribs":{"data":{"Link2App":["https://interactive.libd.org/Lifespan_DG/"],"Title1":["Spatial DG"],"AppType":["spatialLIBD"],"species":["Human"],"GitHub":["spatial_DG_lifespan"],"dataType":["spatial"],"Region":["DG"]},"columns":[{"id":"Link2App","name":"App Link","type":"character","cell":[{"name":"a","attribs":{"href":"https://interactive.libd.org/Lifespan_DG/","target":"_blank"},"children":["Spatial DG: spatialLIBD"]}],"align":"center"},{"id":"Title1","name":"Title1","type":"character","show":false},{"id":"AppType","name":"AppType","type":"character","show":false},{"id":"species","name":"Species","type":"character","align":"center"},{"id":"GitHub","name":"GitHub","type":"character","show":false,"cell":[{"name":"a","a nscriptomic approaches spanning laminar domains, microenvironments, and cell types in postmortem human dlPFC. At the laminar level, SCZ-associated transcriptional changes were strongest in glia-enriched domains (layer 1/meninges and white matter), including down-regulation of microglia-associated genes, whereas genetic risk localized to neuronal-rich gray matter. We next analyzed SCZ-linked microenvironments including neuropil, neuronal, perineuronal net, and vascular compartments. Within these, neuronal and synaptic transcriptional changes were most prominent in neuropil, showing down-regulation of activity-dependent synaptic genes and inhibitory neuron markers. At the cellular level, these signals reflected intrinsic alterations localized to cell types. Across analyses, patterns converged on altered BDNF-TrkB signaling and inhibitory circuit dysfunction. Together, our findings highlight spatial scale as a key determinant in resolving neuronal and non-neuronal aspects of SCZ-associated biology."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Sang Ho Kwon, Boyi Guo, Cindy Fang, Madhavi Tippani, Svitlana V. Bach, Ryan A. Miller, Sarah E. Maguire, Artemis Iatrou, Geo Pertea, Nicholas J. Eagles, Madeline R. Valentine, Seyun Oh, Aarti Jajoo, Vijetha Balakundi, Yufeng Du, Annie B. Nguyen, Ruth Zhang, Uma M. Kaipa, Heena R. Divecha, Jashandeep S. Lobana, Joel E. Kleinman, Shizhong Han, Nikolaos P. Daskalakis, Thomas M. Hyde, Leonardo Collado-Torres, Stephanie C. Page, Kristen R. Maynard, Stephanie C. Hicks, Keri Martinowich"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatialDLPFC_SCZ","target":"_blanks"},"children":["spatialDLPFC_SCZ"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["DOI: "]},{"name":"a","attribs":{"href":"https://d ribs":{"style":{"line-height":"1.6"}},"children":[{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Summary: "]},{"name":"span","attribs":{},"children":["The entorhinal cortex (ERC) is implicated in early progression of Alzheimer’s disease (AD). Here we investigated the impact of established biological risk factors for AD, including APOE genotype (E2 versus E4 alleles), sex, and ancestry, on gene expression in the human ERC. We generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA sequencing data (snRNA-seq) in postmortem human ERC tissue from middle aged brain donors with no history of AD. APOE-dependent changes in gene expression predominantly mapped to a transcriptionally-defined oligodendrocyte subtype, which varied substantially with ancestry, and suggested differences in oligodendrocyte differentiation and myelination. Integration of SRT and snRNA-seq data identified a common gene expression signature associated with APOE genotype, which we localized to the same oligodendrocyte subtype and a white matter spatial domain. This suggests that AD risk in ERC may be associated with disrupted oligodendrocyte function, potentially contributing to future neurodegeneration."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Louise A. Huuki-Myers, Heena R. Divecha, Svitlana V. Bach, Madeline R. Valentine, Nicholas J. Eagles, Bernard Mulvey, Rahul A. Bharadwaj, Ruth Zhang, James R. Evans, Melissa Grant-Peters, Ryan A. Miller, Joel E. Kleinman, Shizhong Han, Thomas M. Hyde, Stephanie C. Page, Daniel R. Weinberger, Keri Martinowich, Mina Ryten, Kristen R. Maynard, Leonardo Collado-Torres"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/LFF_spatial_ERC","target":"_blanks"},"children":["LFF_spatial_ERC"]}]},{"name":"p","a "href":"https://github.com/LieberInstitute/spatial_hpc","target":"_blank"},"children":["spatial_hpc"]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatial_hpc","target":"_blank"},"children":["spatial_hpc"]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatial_hpc","target":"_blank"},"children":["spatial_hpc"]}]},{"id":"dataType","name":"Data Type","type":"character","align":"center"},{"id":"Region","name":"Region","type":"character","align":"center"}],"highlight":true,"compact":true,"dataKey":"c33f224e5bd6bcfae2c5f852feff984c","static":false,"nested":true},"children":[]},{"name":"hr","attribs":{"style":{"margin":"1.5rem 0","border-top":"1px solid #ddd"}},"children":[]},{"name":"div","attribs":{"style":{"line-height":"1.6"}},"children":[{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Summary: "]},{"name":"span","attribs":{},"children":["Cell types in the hippocampus with unique morphology, physiology and connectivity serve specialized functions associated with cognition and mood. These cell types are spatially organized, necessitating molecular profiling strategies that retain cytoarchitectural organization. Here we generated spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from anterior human hippocampus in ten adult neurotypical donors. Using non-negative matrix factorization (NMF) and label transfer, we integrated these data by defining gene expression patterns within the snRNA-seq data and then inferring expression in the SRT data. These patterns captured transcriptional variation across neuronal cell types and indicated spatial organization of excitatory and inhibitory postsynaptic specializations. Leveraging the NMF and label transfer approach with rodent datasets, we identified putative patterns of activity-dependent transcription and circuit connectivity in the human SRT dataset. Finally, we characterized the spatial organization of NMF patterns corresponding to pyramidal neurons and identified regionally-specific snRNA-seq clusters of the retrohippocampus, subiculum and presubiculum. To make this molecular atlas widely accessible, raw and processed data are freely available, including through interactive web applications."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Jacqueline R. Thompson, Erik D. Nelson, Madhavi Tippani, Anthony D. Ramnauth, Heena R. Divecha, Ryan A. Miller, Nicholas J. Eagles, Elizabeth A. Pattie, Sang Ho Kwon, Svitlana V. Bach, Uma M. Kaipa, Jianing Yao, Christine Hou, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Kristen R. Maynard, Thomas M. Hyde, Keri Martinowich, Stephanie C. Page & Stephanie C. Hicks "]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatial_hpc","target":"_blanks"},"children":["spatial_hpc"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["DOI: "]},{"name":"a","attribs":{"href":"https://doi.org/10.1038/s41593-025-02022-0","target":"_blank"},"children":["10.1038/s41593-025-02022-0"]}]}]}]},{"name":"div","attribs":{"style":{"padding":"1.5rem","background":"#f9f9f9","border":"1px solid #ddd","margin":"10px","border-radius":"8px"}},"children":[{"name":"h5","attribs":{"style":{"margin-top":"0","color":"#333"}},"children":["Project Resources"]},{"name":"Reactable","attribs":{"data":{"Link2App":["https://samuibrowser.com/from?url=data.libd.org/samuibrowser/&s=V12D05-348_C1&s=V12D05-348_D1&s=V12D05-350_C1&s=V12D05-350_D1&s=V12D07-075_A1&s=V12D07-075_D1&s=V12Y31-080_A1&s=V13M13-362_A1&s=V13M13-362_D1&s=V13Y24-346_C1","https://samuibrowser.com/from?url=data.libd.org/samuibrowser/&s=X36_5459A&s=X36_5459B&s=X36_8667C&s=X86_reg1&s=X86_reg2&s=X86_reg3&s=X97_reg1&s=X97_reg2&s=X97_reg3&s=X99_1225A&s=X99_1225B&s=X99_8741C&s=X99_8741D"],"Title1":["spatial HYP: Visium","spatial HYP: Xenium"],"AppType":["Samui","Xenium"],"species":["Human","Human"],"GitHub":["spatial_HYP","spatial_HYP"],"dataType":["spatial","spatial"],"Region":["HYP","HYP"]},"columns":[{"id":"Link2App","name":"App Link","type":"character","cell":[{"name":"a","attribs":{"href":"https://samuibrowser.com/from?url=data.libd.org/samuibrowser/&s=V12D05-348_C1&s=V12D05-348_D1&s=V12D05-350_C1&s=V12D05-350_D1&s=V12D07-075_A1&s=V12D07-075_D1&s=V12Y31-080_A1&s=V13M13-362_A1&s=V13M13-362_D1&s=V13Y24-346_C1","target":"_blank"},"children":["spatial HYP: Visium: Samui"]},{"name":"a","attribs":{"href":"https://samuibrowser.com/from?url=data.libd.org/samuibrowser/&s=X36_5459A&s=X36_5459B&s=X36_8667C&s=X86_reg1&s=X86_reg2&s=X86_reg3&s=X97_reg1&s=X97_reg2&s=X97_reg3&s=X99_1225A&s=X99_1225B&s=X99_8741C&s=X99_8741D","target":"_blank"},"children":["spatial HYP: Xenium: Xenium"]}],"align":"center"},{"id":"Title1","name":"Title1","type":"character","show":false},{"id":"AppType","name":"AppType","type":"character","show":false},{"id":"species","name":"Species","type":"character","align":"center"},{"id":"GitHub","name":"GitHub","type":"character","show":false,"cell":[{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatial_HYP","target":"_blank"},"children":["spatial_HYP"]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatial_HYP","target":"_blank"},"children":["spatial_HYP"]}]},{"id":"dataType","name":"Data Type","type":"character","align":"center"},{"id":"Region","name":"Region","type":"character","align":"center"}],"highlight":true,"compact":true,"dataKey":"a8fbba2f883cde46406c1bf2099e3ede","static":false,"nested":true},"children":[]},{"name":"hr","attribs":{"style":{"margin":"1.5rem 0","border-top":"1px solid #ddd"}},"children":[]},{"name":"div","attribs":{"style":{"line-height":"1.6"}},"children":[{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Summary: "]},{"name":"span","attribs":{},"children":["The hypothalamus contains multiple regions, including the ventromedial hypothalamus (VMH) and arcuate (ARC), which are responsible for sex-differentiated functions such as endocrine signaling, metabolism, and reproductive behaviors. While molecular, anatomic, and sex-differentiated features of the rodent hypothalamus are well established, much less is known about these regions in humans. Here, we provide a spatially resolved single-cell atlas of sex-differentially expressed (sex-DE) genes in the human ARC and VMH. We identify neuronal populations governing hypothalamus-specific functions, define their spatial distributions, and show enrichment of sex-DE in retinoid metabolism- and retinoid receptor-regulated genes. Within the ARC and VMH, we find correlated autosomal expression differences localized to ESR1/TAC3-expressing and corticotropin-releasing hormone receptor 2 (CRHR2)-expressing neurons and extensive sex-DE genes linked to sex-biased disorders, including autism, depression, and schizophrenia. Our molecular mapping of disease associations to hypothalamic cell types with established roles in sex-divergent physiology and behavior provides insights into the mechanistic bases of sex bias in neurodevelopmental and neuropsychiatric disorders."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Bernard Mulvey, Yi Wang, Heena R. Divecha, Svitlana V. Bach, Kelsey D. Montgomery, Sophia Cinquemani, Atharv Chandra, Yufeng Du, Ryan A. Miller, Joel E. Kleinman, Stephanie C. Page, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Kasper D. Hansen, Kristen R. Maynard"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatial_HYP","target":"_blanks"},"children":["spatial_HYP"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["DOI: "]},{"name":"a","attribs":{"href":"https://doi.org/10.1016/j.celrep.2025.116877","target":"_blank"},"children":["10.1016/j.celrep.2025.116877"]}]}]}]},{"name":"div","attribs":{"style":{"padding":"1.5rem","background":"#f9f9f9","border":"1px solid #ddd","margin":"10px","border-radius":"8px"}},"children":[{"name":"h5","attribs":{"style":{"margin-top":"0","color":"#333"}},"children":["Project Resources"]},{"name":"Reactable","attribs":{"data":{"Link2App":["https://interactive.libd.org/LFF_spatial_LC/"],"Title1":["Spatial LC"],"AppType":["spatialLIBD"],"species":["Human"],"GitHub":["LFF_spatial_LC"],"dataType":["spatial"],"Region":["LC"]},"columns":[{"id":"Link2App","name":"App Link","type":"character","cell":[{"name":"a","attribs":{"href":"https://interactive.libd.org/LFF_spatial_LC/","target":"_blank"},"children":["Spatial LC: spatialLIBD"]}],"align":"center"},{"id":"Title1","name":"Title1","type":"character","show":false},{"id":"AppType","name":"AppType","type":"character","show":false},{"id":"species","name":"Species","type":"character","align":"center"},{"id":"GitHub","name":"GitHub","type":"character","show":false,"cell":[{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/LFF_spatial_LC","target":"_blank"},"children":["LFF_spatial_LC"]}]},{"id":"dataType","name":"Data Type","type":"character","align":"center"},{"id":"Region","name":"Region","type":"character","align":"center"}],"highlight":true,"compact":true,"dataKey":"1bc37eea5082012263809cbb57ad4094","static":false,"nested":true},"children":[]},{"name":"hr","attribs":{"style":{"margin":"1.5rem 0","border-top":"1px solid #ddd"}},"children":[]},{"name":"div","attribs":{"style":{"line-height":"1.6"}},"children":[{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Summary: "]},{"name":"span","attribs":{},"children":["The locus coeruleus (LC) is a small noradrenergic nucleus in the dorsal pons that sends projections across the brain regulating sleep, arousal, attention, stress responses, and some forms of cognition. LC neurons show pathology in the earliest stages of Alzheimer’s disease (AD), including age-related accumulation of hyperphosphorylated tau (pTau) and accelerated loss of neuromelanin (NM) pigmentation. NM-sensitive neuroimaging of the LC predicts previous cognitive decline, clinical severity, and future AD progression. While these findings suggest that the LC plays an etiologic role in AD, the molecular landscape of the LC prior to clinical manifestation of sporadic AD remains largely uncharacterized. This information is critical for developing interventions that preserve LC integrity and function. We performed spatially-resolved transcriptomics on 85 sections of human postmortem LC from N=33 neurotypical middle-aged donors, balanced for epidemiologic AD risk factors including sex, African or European ancestry, and APOE genotype (carriers of the E4/risk or E2/protective alleles). Comparing across APOE genotypes, we find astrocytic gene expression differences proximal to LC neurons. Associating NM content with local gene expression, we show that higher overall APOE gene expression correlates with reduced NM content and an enrichment of NM-associated genes in aging pathways. Unexpectedly, we find enriched LC expression of cholesterol synthesis genes, alongside evidence for lipid synthesis gene regulatory network activity in NM-containing LC specifically, revealing a potential intersection between intrinsic lipid metabolism in LC neurons, NM, and the role of APOE-mediated lipid biology in AD. Together, these data illuminate the molecular features of the human LC at spatial resolution with unprecedented sampling depth, revealing how AD risk factors and NM content influence resilience and susceptibility of this critical brain nucleus to pathology accumulation and degeneration."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Bernard Mulvey, Heena R. Divecha, Madhavi Tippani, Svitlana V. Bach, Rahul Bharadwaj, Ishbel Del Rosario, Sarah E. Maguire, Ryan A. Miller, Aaron J. Salisbury, Atharv Chandra, Beau A. Oster, Kelsey D. Montgomery, Sang Ho Kwon, Haya A. Algrain, Alexis R. Papariello, Louise A. Huuki-Myers, Joel E. Kleinman, Leonardo Collado-Torres, Thomas M. Hyde, Shizhong Han, Stephanie C. Hicks, Daniel R. Weinberger, Stephanie C. Page, Kristen R. Maynard, Keri Martinowich"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/LFF_spatial_LC","target":"_blanks"},"children":["LFF_spatial_LC"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["DOI: "]},{"name":"a","attribs":{"href":"https://doi.org/10.1101/2025.10.29.685354","target":"_blank"},"children":["10.1101/2025.10.29.685354"]}]}]}]},{"name":"div","attribs":{"style":{"padding":"1.5rem","background":"#f9f9f9","border":"1px solid #ddd","margin":"10px","border-radius":"8px"}},"children":[{"name":"h5","attribs":{"style":{"margin-top":"0","color":"#333"}},"children":["Project Resources"]},{"name":"Reactable","attribs":{"data":{"Link2App":["https://interactive.libd.org/snRNAseq_lateral_septum/","https://interactive.libd.org/bulkseq_lateral_septum/"],"Title1":["septum_lateral","septum_lateral"],"AppType":["iSEE","iSEE"],"species":["Mouse","Mouse"],"GitHub":["septum_lateral","septum_lateral"],"dataType":["snRNA-seq","bulk RNA-seq"],"Region":["LS","LS"]},"columns":[{"id":"Link2App","name":"App Link","type":"character","cell":[{"name":"a","attribs":{"href":"https://interactive.libd.org/snRNAseq_lateral_septum/","target":"_blank"},"children":["septum_lateral: iSEE"]},{"name":"a","attribs":{"href":"https://interactive.libd.org/bulkseq_lateral_septum/","target":"_blank"},"children":["septum_lateral: iSEE"]}],"align":"center"},{"id":"Title1","name":"Title1","type":"character","show":false},{"id":"AppType","name":"AppType","type":"character","show":false},{"id":"species","name":"Species","type":"character","align":"center"},{"id":"GitHub","name":"GitHub","type":"character","show":false,"cell":[{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/septum_lateral","target":"_blank"},"children":["septum_lateral"]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/septum_lateral","target":"_blank"},"children":["septum_lateral"]}]},{"id":"dataType","name":"Data Type","type":"character","align":"center"},{"id":"Region","name":"Region","type":"character","align":"center"}],"highlight":true,"compact":true,"dataKey":"633a54f5377ce048b89b52ef79eb0751","static":false,"nested":true},"children":[]},{"name":"hr","attribs":{"style":{"margin":"1.5rem 0","border-top":"1px solid #ddd"}},"children":[]},{"name":"div","attribs":{"style":{"line-height":"1.6"}},"children":[{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Summary: "]},{"name":"span","attribs":{},"children":["The lateral septum (LS), a GABAergic structure located in the basal forebrain, is implicated in social behavior, learning, and memory. We previously demonstrated that expression of tropomyosin kinase receptor B (TrkB) in LS neurons is required for social novelty recognition. To better understand molecular mechanisms by which TrkB signaling controls behavior, we locally knocked down TrkB in LS and used bulk RNA-sequencing to identify changes in gene expression downstream of TrkB. TrkB knockdown induces upregulation of genes associated with inflammation and immune responses, and downregulation of genes associated with synaptic signaling and plasticity. Next, we generated one of the first atlases of molecular profiles for LS cell types using single nucleus RNA-sequencing (snRNA-seq). We identified markers for the septum broadly, and the LS specifically, as well as for all neuronal cell types. We then investigated whether the differentially expressed genes (DEGs) induced by TrkB knockdown map to specific LS cell types. Enrichment testing identified that downregulated DEGs are broadly expressed across neuronal clusters. Enrichment analyses of these DEGs demonstrated that downregulated genes are uniquely expressed in the LS, and associated with either synaptic plasticity or neurodevelopmental disorders. Upregulated genes are enriched in LS microglia, associated with immune response and inflammation, and linked to both neurodegenerative disease and neuropsychiatric disorders. In addition, many of these genes are implicated in regulating social behaviors. In summary, the findings implicate TrkB signaling in the LS as a critical regulator of gene networks associated with psychiatric disorders that display social deficits, including schizophrenia and autism, and with neurodegenerative diseases, including Alzheimer’s."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Lionel A. Rodriguez, Matthew Nguyen Tran, Renee Garcia-Flores, Seyun Oh, Robert A. Phillips III, Elizabeth A. Pattie, Heena R. Divecha, Sun Hong Kim, Joo Heon Shin, Yong Kyu Lee, Carly Montoya, Andrew E. Jaffe, Leonardo Collado-Torres, Stephanie C. Page & Keri Martinowich "]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/septum_lateral","target":"_blanks"},"children":["septum_lateral"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["DOI: "]},{"name":"a","attribs":{"href":"https://doi.org/10.1038/s41398-024-02758-6","target":"_blank"},"children":["10.1038/s41398-024-02758-6"]}]}]}]},{"name":"div","attribs":{"style":{"padding":"1.5rem","background":"#f9f9f9","border":"1px solid #ddd","margin":"10px","border-radius":"8px"}},"children":[{"name":"h5","attribs":{"style":{"margin-top":"0","color":"#333"}},"children":["Project Resources"]},{"name":"R t their spatial organization remains unclear. We generated a spatiomolecular atlas of the human NAc by integrating paired single-cell and spatial transcriptomics of postmortem NAc tissue. We identified transcriptionally unique cell populations and spatial domains (SpDs), including D1 islands composed of discrete MSN subtypes enriched for dopamine receptor D1 (DRD1) and OPRM1. We demonstrated continuous spatial gene expression gradients across the NAc and evolutionary conservation of spatial features. We also identified SpDs associated with risk for psychiatric and addiction-related traits and spatially mapped risk-associated ligand-receptor interactions. Finally, we predicted enrichment of drug-responsive transcriptional programs in both SpDs and cell types. Collectively, we provide a spatiomolecular framework for understanding the relevance of the human NAc in neuropsychiatric diseases."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Prashanthi Ravichandran, Svitlana V. Bach, Robert A. Phillips, III, Madeline R. Valentine, Nicholas J. Eagles, Yufeng Du, Ishbel del Rosario, Haya A. AlGrain, Sarah E. Maguire, Ryan A. Miller, Heena R. Divecha, Madhavi Tippani, Kelsey D. Montgomery, Joel E. Kleinman, Shizhong Han, Stephanie C. Page, Thomas M. Hyde, Leonardo Collado-Torres, Alexis Battle, Keri Martinowich, Stephanie C. Hicks, Kristen R. Maynard"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatial_NAc","target":"_blanks"},"children":["spatial_NAc"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["DOI: "]},{"name":"a","attribs":{"href":"https://doi.org/10.1101/2025.09.10.675374 ","target":"_blank"},"children":["10.1101/2025.09.10.675374 "]}]}]}]},{"name":"div","attribs":{"style":{"padding":"1.5rem","background":"#f9f9f9","border":"1p xpression-driven clusters. By integrating neuropsychiatric disorder gene sets, we showed differential layer-enriched expression of genes associated with schizophrenia and autism spectrum disorder, highlighting the clinical relevance of spatially-defined expression. We then developed a data-driven framework to define unsupervised clusters in spatial transcriptomics data, which can be applied to other tissues or brain regions where morphological architecture is not as well-defined as cortical laminae. We lastly created a web application for the scientific community to explore these raw and summarized data to augment ongoing neuroscience and spatial transcriptomics research."]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["Authors: "]},{"name":"span","attribs":{},"children":["Kristen R Maynard, Leonardo Collado-Torres, Lukas M Weber, Cedric Uytingco, Brianna K Barry, Stephen R Williams, Joseph L Catallini II, Matthew N Tran, Zachary Besich, Madhavi Tippani, Jennifer Chew, Yifeng Yin, Joel E Kleinman, Thomas M Hyde, Nikhil Rao, Stephanie C Hicks, Keri Martinowich, Andrew E Jaffe"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["GitHub: "]},{"name":"a","attribs":{"href":"https://github.com/LieberInstitute/spatialLIBD","target":"_blanks"},"children":["spatialLIBD"]}]},{"name":"p","attribs":{},"children":[{"name":"strong","attribs":{},"children":["DOI: "]},{"name":"a","attribs":{"href":"https://doi.org/10.1038/s41593-020-00787-0","target":"_blank"},"children":["10.1038/s41593-020-00787-0"]}]}]}]},{"name":"div","attribs":{"style":{"padding":"1.5rem","background":"#f9f9f9","border":"1px solid #ddd","margin":"10px","border-radius":"8px"}},"children":[{"name":"h5","attribs":{"style":{"margin-top":"0","color":"#333"}},"children":["Project Resources"]},{"name":"Reactable","attribs":{"data":{"Link2App":["https://interactive.libd.org/tran2021_AMY/","https://interactive.libd.org/tran2021_DLPFC/","https://interac           const selector = 'span[' + cellAttr + '][' + lineAttr + ']';
          return selector;
        }
        const selectCodeLines = (annoteEl) => {
          const doc = window.document;
          const targetCell = annoteEl.getAttribute("data-target-cell");
          const targetAnnotation = annoteEl.getAttribute("data-target-annotation");
          const annoteSpan = window.document.querySelector(selectorForAnnotation(targetCell, targetAnnotation));
          const lines = annoteSpan.getAttribute("data-code-lines").split(",");
          const lineIds = lines.map((line) => {
            return targetCell + "-" + line;
          })
          let top = null;
          let height = null;
          let parent = null;
          if (lineIds.length > 0) {
              //compute the position of the single el (top and bottom and make a div)
              const el = window.document.getElementById(lineIds[0]);
              top = el.offsetTop;
              height = el.offsetHeight;
              parent = el.parentElement.parentElement;
            if (lineIds.length > 1) {
              const lastEl = window.document.getElementById(lineIds[lineIds.length - 1]);
              const bottom = lastEl.offsetTop + lastEl.offsetHeight;
              height = bottom - top;
            }
            if (top !== null && height !== null && parent !== null) {
              // cook up a div (if necessary) and position it 
              let div = window.document.getElementById("code-annotation-line-highlight");
              if (div === null) {
                div = window.document.createElement("div");
                div.setAttribute("id", "code-annotation-line-highlight");
                div.style.position = 'absolute';
                parent.appendChild(div);
              }
              div.style.top = top - 2 + "px";
              div.style.height = height + 4 + "px";
              div.style.left = 0;
              let gutterDiv = window.document.getElementById("code-annotation-line-highlight-gutter");
              if (gutterDiv === null) {
                gutterDiv = window.document.createElement("div");
                gutterDiv.setAttribute("id", "code-annotation-line-highlight-gutter");
                gutterDiv.style.position = 'absolute';
                const codeCell = window.document.getElementById(targetCell);
                const gutter = codeCell.querySelector('.code-annotation-gutter');
                gutter.appendChild(gutterDiv);
              }
              gutterDiv.style.top = top - 2 + "px";
              gutterDiv.style.height = height + 4 + "px";
            }
            selectedAnnoteEl = annoteEl;
          }
        };
        const unselectCodeLines = () => {
          const elementsIds = ["code-annotation-line-highlight", "code-annotation-line-highlight-gutter"];
          elementsIds.forEach((elId) => {
            const div = window.document.getElementById(elId);
            if (div) {
              div.remove();
            }
          });
          selectedAnnoteEl = undefined;
        };
          // Handle positioning of the toggle
      window.addEventListener(
        "resize",
        throttle(() => {
          elRect = undefined;
          if (selectedAnnoteEl) {
            selectCodeLines(selectedAnnoteEl);
          }
        }, 10)
      );
      function throttle(fn, ms) {
      let throttle = false;
      let timer;
        return (...args) => {
          if(!throttle) { // first call gets through
              fn.apply(this, args);
              throttle = true;
          } else { // all the others get throttled
              if(timer) clearTimeout(timer); // cancel #2
              timer = setTimeout(() => {
                fn.apply(this, args);
                timer = throttle = false;
              }, ms);
          }
        };
      }
        // Attach click handler to the DT
        const annoteDls = window.document.querySelectorAll('dt[data-target-cell]');
        for (const annoteDlNode of annoteDls) {
          annoteDlNode.addEventListener('click', (event) => {
            const clickedEl = event.target;
            if (clickedEl !== selectedAnnoteEl) {
              unselectCodeLines();
              const activeEl = window.document.querySelector('dt[data-target-cell].code-annotation-active');
              if (activeEl) {
                activeEl.classList.remove('code-annotation-active');
              }
              selectCodeLines(clickedEl);
              clickedEl.classList.add('code-annotation-active');
            } else {
              // Unselect the line
              unselectCodeLines();
              clickedEl.classList.remove('code-annotation-active');
            }
          });
        }
    const findCites = (el) => {
      const parentEl = el.parentElement;
      if (parentEl) {
        const cites = parentEl.dataset.cites;
        if (cites) {
          return {
            el,
            cites: cites.split(' ')
          };
        } else {
          return findCites(el.parentElement)
        }
      } else {
        return undefined;
      }
    };
    var bibliorefs = window.document.querySelectorAll('a[role="doc-biblioref"]');
    for (var i=0; i<bibliorefs.length; i++) {
      const ref = bibliorefs[i];
      const citeInfo = findCites(ref);
      if (citeInfo) {
        tippyHover(citeInfo.el, function() {
          var popup = window.document.createElement('div');
          citeInfo.cites.forEach(function(cite) {
            var citeDiv = window.document.createElement('div');
            citeDiv.classList.add('hanging-indent');
            citeDiv.classList.add('csl-entry');
            var biblioDiv = window.document.getElementById('ref-' + cite);
            if (biblioDiv) {
              citeDiv.innerHTML = biblioDiv.innerHTML;
            }
            popup.appendChild(citeDiv);
          });
          return popup.innerHTML;
        });
      }
    }
  });
  </script>
