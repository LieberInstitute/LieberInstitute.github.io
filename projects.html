<script type="application/json" data-for="htmlwidget-73ca8502b8ba68ab05f8">{"x":{"tag":{"name":"Reactable","attribs":{"data":{"project_id":["VisStitch2025","bla2025","dacc2026","dg2025","dlpfc2024","dlpfcSCZ","erc2026","hpc2025","hyp2026","lc2026","ls2024","nac2026","spatialLIBD2021","tran2021"],"FullTitle":["Integrating gene expression and imaging data across Visium capture areas with visiumStitched","Transcriptomic diversity of amygdalar subdivisions across humans and nonhuman primates","Spatio-molecular gene expression reflects dorsal anterior cingulate cortex structure and function in the human brain","Spatiotemporal analysis of gene expression in the human dentate gyrus reveals age-associated changes in cellular maturation and neuroinflammation","A data-driven single cell and spatial transcriptomic map of the human prefrontal cortex","Mapping spatially organized molecular and genetic signatures of schizophrenia across multiple scales in human prefrontal cortex","APOE E4 Alzheimer’s Risk Converges on an Oligodendrocyte Subtype in the Human Entorhinal Cortex","An integrated single-nucleus and spatial transcriptomics atlas reveals the molecular landscape of the human hippocampus","Spatially-resolved molecular sex differences at single cell resolution in the adult human ventromedial and arcuate hypothalamus","Impact of Alzheimer’s disease risk factors and local neuromelanin content on the transcriptomic landscape of the human locus coeruleus","TrkB-dependent regulation of molecular signaling across septal cell types","Spatiomolecular mapping reveals anatomical organization of heterogeneous cell types in the human nucleus accumbens","Transcriptome-scale spatial gene expression in the human dorsolateral prefrontal cortex","Single-nucleus transcriptome analysis reveals cell-type-specific molecular signatures across reward circuitry in the human brain"],"Region":["Cortex","BLA","dACC","DG","DLPFC","DLPFC-SCZ","ERC","HPC","HYP","LC","LS","NAc","DLPFC","AMY"],"Year":[2025,2025,2026,2025,2024,2026,2026,2025,2026,2026,2024,2026,2021,2021],"dx":["neurotypical","neurotypical","neurotypical","neurotypical","neurotypical","schizophrenia","Alzheimer's disease","neurotypical","neurotypical","Alzheimer's disease","wild type","neurotypical","neurotypical","neurotypical"],"species":["Human","Human : Baboon : Macaque","Human","Human","Human","Human","Human","Human","Human","Human","Mouse","Human","Human","Human"],"Authors_Group":["Nicholas J. Eagles, Svitlana V. Bach, Madhavi Tippani, Prashanthi Ravichandran, Yufeng Du, Ryan A. Miller, Thomas M. Hyde, Stephanie C. Page, Keri Martinowich & Leonardo Collado-Torres","Michael S. Totty, Rita Cervera Juanes, Svitlana V. Bach, Lamya Ben Ameur, Madeline R. Valentine, Evan Simons, McKenna D. Romac, Hoa Trinh, Krystal Henderson, Ishbel Del Rosario, Madhavi Tippani, Ryan A. Miller, Joel E. Kleinman, Stephanie Cerceo Page, Arpiar Saunders, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Vincent D. Costa","Kinnary Shah, Michael S. Totty, Svitlana V. Bach, Madeline R. Valentine, Atharv Chandra, Heena R. Divecha, Ryan A. Miller, Sang Ho Kwon, Anthony D. Ramnauth, Madhavi Tippani, Sanjana Tyagi, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Thomas M. Hyde, Stephanie C. Page, Kristen R. Maynard, Stephanie C. Hicks, Keri Martinowich","Anthony D. Ramnauth, Madhavi Tippani, Heena R. Divecha, Alexis R. Papariello, Ryan A. Miller,  Erik D. Nelson, Jacqueline R. Thompson, Elizabeth A. Pattie, Joel E. Kleinman, Kristen R. Maynard, Leonardo Collado-Torres, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Stephanie C. Page","Louise A Huuki-Myers, Abby Spangler , Nicholas J Eagles , Kelsey D Montgomery , Sang Ho Kwon , Boyi Guo, Melissa Grant-Peters, Heena R Divecha, Madhavi Tippani, Chaichontat Sriworarat, Annie B Nguyen , Prashanthi Ravichandran, Matthew N Tran, Arta Seyedian; PsychENCODE Consortium; Thomas M Hyde, Joel E Kleinman, Alexis Battle, Stephanie C Page, Mina Ryten , Stephanie C Hicks, Keri Martinowich, Leonardo Collado-Torres , Kristen R Maynard","Sang Ho Kwon, Boyi Guo, Cindy Fang, Madhavi Tippani, Svitlana V. Bach, Ryan A. Miller, Sarah E. Maguire, Artemis Iatrou, Geo Pertea, Nicholas J. Eagles, Madeline R. Valentine, Seyun Oh, Aarti Jajoo, Vijetha Balakundi, Yufeng Du, Annie B. Nguyen, Ruth Zhang, Uma M. Kaipa, Heena R. Divecha, Jashandeep S. Lobana, Joel E. Kleinman, Shizhong Han, Nikolaos P. Daskalakis, Thomas M. Hyde, Leonardo Collado-Torres, Stephanie C. Page, Kristen R. Maynard, Stephanie C. Hicks, Keri Martinowich","Louise A. Huuki-Myers, Heena R. Divecha, Svitlana V. Bach, Madeline R. Valentine, Nicholas J. Eagles, Bernard Mulvey, Rahul A. Bharadwaj, Ruth Zhang, James R. Evans, Melissa Grant-Peters, Ryan A. Miller, Joel E. Kleinman, Shizhong Han, Thomas M. Hyde, Stephanie C. Page, Daniel R. Weinberger, Keri Martinowich, Mina Ryten, Kristen R. Maynard, Leonardo Collado-Torres","Jacqueline R. Thompson, Erik D. Nelson, Madhavi Tippani, Anthony D. Ramnauth, Heena R. Divecha, Ryan A. Miller, Nicholas J. Eagles, Elizabeth A. Pattie, Sang Ho Kwon, Svitlana V. Bach, Uma M. Kaipa, Jianing Yao, Christine Hou, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Kristen R. Maynard, Thomas M. Hyde, Keri Martinowich, Stephanie C. Page & Stephanie C. Hicks ","Bernard Mulvey, Yi Wang, Heena R. Divecha, Svitlana V. Bach, Kelsey D. Montgomery, Sophia Cinquemani, Atharv Chandra, Yufeng Du, Ryan A. Miller, Joel E. Kleinman, Stephanie C. Page, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Kasper D. Hansen, Kristen R. Maynard","Bernard Mulvey, Heena R. Divecha, Madhavi Tippani, Svitlana V. Bach, Rahul Bharadwaj, Ishbel Del Rosario, Sarah E. Maguire, Ryan A. Miller, Aaron J. Salisbury, Atharv Chandra, Beau A. Oster, Kelsey D. Montgomery, Sang Ho Kwon, Haya A. Algrain, Alexis R. Papariello, Louise A. Huuki-Myers, Joel E. Kleinman, Leonardo Collado-Torres, Thomas M. Hyde, Shizhong Han, Stephanie C. Hicks, Daniel R. Weinberger, Stephanie C. Page, Kristen R. Maynard, Keri Martinowich","Lionel A. Rodriguez, Matthew Nguyen Tran, Renee Garcia-Flores, Seyun Oh, Robert A. Phillips III, Elizabeth A. Pattie, Heena R. Divecha, Sun Hong Kim, Joo Heon Shin, Yong Kyu Lee, Carly Montoya, Andrew E. Jaffe, Leonardo Collado-Torres, Stephanie C. Page & Keri Martinowich ","Prashanthi Ravichandran, Svitlana V. Bach, Robert A. Phillips, III, Madeline R. Valentine, Nicholas J. Eagles, Yufeng Du, Ishbel del Rosario, Haya A. AlGrain, Sarah E. Maguire, Ryan A. Miller, Heena R. Divecha, Madhavi Tippani, Kelsey D. Montgomery, Joel E. Kleinman, Shizhong Han, Stephanie C. Page, Thomas M. Hyde, Leonardo Collado-Torres, Alexis Battle, Keri Martinowich, Stephanie C. Hicks, Kristen R. Maynard","Kristen R Maynard, Leonardo Collado-Torres, Lukas M Weber, Cedric Uytingco, Brianna K Barry, Stephen R Williams, Joseph L Catallini II, Matthew N Tran, Zachary Besich, Madhavi Tippani, Jennifer Chew, Yifeng Yin, Joel E Kleinman, Thomas M Hyde, Nikhil Rao, Stephanie C Hicks, Keri Martinowich, Andrew E Jaffe","Matthew N. Tran, Kristen R. Maynard, Abby Spangler, Louise A. Huuki, Kelsey D. Montgomery, Vijay Sadashivaiah, Madhavi Tippani, Brianna K. Barry, Dana B. Hancock, Stephanie C. Hicks, Joel E. Kleinman, Thomas M. Hyde, Leonardo Collado-Torres, Andrew E. Jaffe, Keri Martinowich"],"Summary_Group":["visiumStitched provides a simple, but flexible framework to handle various multi-capture area study design scenarios. Specifically, it resolves a data processing step without disrupting analysis workflows and without discarding data from overlapping spots. visiumStitched relies on affine transformations by Fiji, which have limitations and are less accurate when aligning against an atlas or other situations. visiumStitched provides an easy-to-use solution which expands possibilities for designing multi-capture area study designs.","The amygdaloid complex mediates learning, memory, and emotions. Understanding cellular and anatomical features specialized in the primate amygdala versus other mammals requires a systematic, anatomically resolved molecular analysis of neuron types. We analyzed five nuclear subdivisions of the primate amygdala with single-nucleus RNA sequencing in macaques, baboons, and humans to examine gene expression profiles for excitatory and inhibitory neurons. Integrated analyses across species identified diverse subtypes of glutamatergic and GABAergic neurons that are highly conserved across primates. Compositional analyses revealed that subdivisions of the primate basolateral complex contain distinct classes of glutamatergic neurons and divergent gene expression profiles for parvalbumin and somatostatin GABAergic neurons. Referencing primate neuron types to transcriptomic atlases of the murine amygdala highlighted primate-specific specializations for glutamatergic neurons and identified which neuron types are conserved across mammals and amygdalar subdivisions. Understanding the molecular heterogeneity of anatomically resolved amygdalar neuron types provides a cellular framework for improving models of how amygdalar circuits contribute to cognition and mental health.","In the human brain, the dorsal anterior cingulate cortex (dACC) plays key roles in various components of cognitive control, and is particularly relevant for reward processing and conflict monitoring. The dACC regulates expression of fear and pain, and its dysfunction is implicated in a number of neuropsychiatric disorders. Compared to more recently specialized neocortical areas, such as the dorsolateral prefrontal cortex (dlPFC), the dACC is evolutionarily older. The region’s agranular structure, and other evolutionary specializations, such as the presence of von Economo neurons (VENs), contribute to its specialized roles in cognitive and emotional processing. Here, we generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from adjacent tissue sections of the dACC in ten adult neurotypical donors to define molecular profiles for dACC cell types and spatial domains. Using non-negative matrix factorization (NMF), we integrated these data by identifying gene expression patterns within the snRNA-seq data, which were projected onto the SRT data to infer the spatial localization. Combining these data with publicly available resources, we revealed insights about molecular profiles, spatial topography, enrichment of disease risk, and putative connectivity of spatially-localized dACC cell types, including VENs. Utilizing published dlPFC snRNA-seq and SRT data collected in the same neurotypical brain donors used here, we deployed cross-region comparison analyses between dACC and dlPFC to understand spatio-molecular specializations and laminar organization across human brain evolution. To make this comprehensive molecular resource accessible to the scientific community, we made both raw and processed data freely available, including through interactive web applications.","The dentate gyrus of the hippocampus is important for many cognitive functions, including learning, memory, and mood. Here, we present transcriptome-wide spatial gene expression maps of the human dentate gyrus and investigate age-associated changes across the lifespan. Genes associated with neurogenesis and the extracellular matrix are enriched in infants and decline throughout development and maturation. Following infancy, inhibitory neuron markers increase, and cellular proliferation markers decrease. We also identify spatio-molecular signatures that support existing evidence for protracted maturation of granule cells during adulthood and age-associated increases in neuroinflammation-related gene expression. Our findings support the notion that the hippocampal neurogenic niche undergoes major changes following infancy and identify molecular regulators of brain aging in glial- and neuropil-enriched tissue.","The molecular organization of the human neocortex historically has been studied in the context of its histological layers. However, emerging spatial transcriptomic technologies have enabled unbiased identification of transcriptionally defined spatial domains that move beyond classic cytoarchitecture. We used the Visium spatial gene expression platform to generate a data-driven molecular neuroanatomical atlas across the anterior-posterior axis of the human dorsolateral prefrontal cortex. Integration with paired single-nucleus RNA-sequencing data revealed distinct cell type compositions and cell-cell interactions across spatial domains. Using PsychENCODE and publicly available data, we mapped the enrichment of cell types and genes associated with neuropsychiatric disorders to discrete spatial domains.","The dorsolateral prefrontal cortex (dlPFC) is central to cognitive dysfunction in schizophrenia (SCZ), yet how molecular changes are organized across cortex remains unclear. Here, we applied complementary spatial transcriptomic approaches spanning laminar domains, microenvironments, and cell types in postmortem human dlPFC. At the laminar level, SCZ-associated transcriptional changes were strongest in glia-enriched domains (layer 1/meninges and white matter), including down-regulation of microglia-associated genes, whereas genetic risk localized to neuronal-rich gray matter. We next analyzed SCZ-linked microenvironments including neuropil, neuronal, perineuronal net, and vascular compartments. Within these, neuronal and synaptic transcriptional changes were most prominent in neuropil, showing down-regulation of activity-dependent synaptic genes and inhibitory neuron markers. At the cellular level, these signals reflected intrinsic alterations localized to cell types. Across analyses, patterns converged on altered BDNF-TrkB signaling and inhibitory circuit dysfunction. Together, our findings highlight spatial scale as a key determinant in resolving neuronal and non-neuronal aspects of SCZ-associated biology.","The entorhinal cortex (ERC) is implicated in early progression of Alzheimer’s disease (AD). Here we investigated the impact of established biological risk factors for AD, including APOE genotype (E2 versus E4 alleles), sex, and ancestry, on gene expression in the human ERC. We generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA sequencing data (snRNA-seq) in postmortem human ERC tissue from middle aged brain donors with no history of AD. APOE-dependent changes in gene expression predominantly mapped to a transcriptionally-defined oligodendrocyte subtype, which varied substantially with ancestry, and suggested differences in oligodendrocyte differentiation and myelination. Integration of SRT and snRNA-seq data identified a common gene expression signature associated with APOE genotype, which we localized to the same oligodendrocyte subtype and a white matter spatial domain. This suggests that AD risk in ERC may be associated with disrupted oligodendrocyte function, potentially contributing to future neurodegeneration.","Cell types in the hippocampus with unique morphology, physiology and connectivity serve specialized functions associated with cognition and mood. These cell types are spatially organized, necessitating molecular profiling strategies that retain cytoarchitectural organization. Here we generated spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from anterior human hippocampus in ten adult neurotypical donors. Using non-negative matrix factorization (NMF) and label transfer, we integrated these data by defining gene expression patterns within the snRNA-seq data and then inferring expression in the SRT data. These patterns captured transcriptional variation across neuronal cell types and indicated spatial organization of excitatory and inhibitory postsynaptic specializations. Leveraging the NMF and label transfer approach with rodent datasets, we identified putative patterns of activity-dependent transcription and circuit connectivity in the human SRT dataset. Finally, we characterized the spatial organization of NMF patterns corresponding to pyramidal neurons and identified regionally-specific snRNA-seq clusters of the retrohippocampus, subiculum and presubiculum. To make this molecular atlas widely accessible, raw and processed data are freely available, including through interactive web applications.","The hypothalamus contains multiple regions, including the ventromedial hypothalamus (VMH) and arcuate (ARC), which are responsible for sex-differentiated functions such as endocrine signaling, metabolism, and reproductive behaviors. While molecular, anatomic, and sex-differentiated features of the rodent hypothalamus are well established, much less is known about these regions in humans. Here, we provide a spatially resolved single-cell atlas of sex-differentially expressed (sex-DE) genes in the human ARC and VMH. We identify neuronal populations governing hypothalamus-specific functions, define their spatial distributions, and show enrichment of sex-DE in retinoid metabolism- and retinoid receptor-regulated genes. Within the ARC and VMH, we find correlated autosomal expression differences localized to ESR1/TAC3-expressing and corticotropin-releasing hormone receptor 2 (CRHR2)-expressing neurons and extensive sex-DE genes linked to sex-biased disorders, including autism, depression, and schizophrenia. Our molecular mapping of disease associations to hypothalamic cell types with established roles in sex-divergent physiology and behavior provides insights into the mechanistic bases of sex bias in neurodevelopmental and neuropsychiatric disorders.","The locus coeruleus (LC) is a small noradrenergic nucleus in the dorsal pons that sends projections across the brain regulating sleep, arousal, attention, stress responses, and some forms of cognition. LC neurons show pathology in the earliest stages of Alzheimer’s disease (AD), including age-related accumulation of hyperphosphorylated tau (pTau) and accelerated loss of neuromelanin (NM) pigmentation. NM-sensitive neuroimaging of the LC predicts previous cognitive decline, clinical severity, and future AD progression. While these findings suggest that the LC plays an etiologic role in AD, the molecular landscape of the LC prior to clinical manifestation of sporadic AD remains largely uncharacterized. This information is critical for developing interventions that preserve LC integrity and function. We performed spatially-resolved transcriptomics on 85 sections of human postmortem LC from N=33 neurotypical middle-aged donors, balanced for epidemiologic AD risk factors including sex, African or European ancestry, and APOE genotype (carriers of the E4/risk or E2/protective alleles). Comparing across APOE genotypes, we find astrocytic gene expression differences proximal to LC neurons. Associating NM content with local gene expression, we show that higher overall APOE gene expression correlates with reduced NM content and an enrichment of NM-associated genes in aging pathways. Unexpectedly, we find enriched LC expression of cholesterol synthesis genes, alongside evidence for lipid synthesis gene regulatory network activity in NM-containing LC specifically, revealing a potential intersection between intrinsic lipid metabolism in LC neurons, NM, and the role of APOE-mediated lipid biology in AD. Together, these data illuminate the molecular features of the human LC at spatial resolution with unprecedented sampling depth, revealing how AD risk factors and NM content influence resilience and susceptibility of this critical brain nucleus to pathology accumulation and degeneration.","The lateral septum (LS), a GABAergic structure located in the basal forebrain, is implicated in social behavior, learning, and memory. We previously demonstrated that expression of tropomyosin kinase receptor B (TrkB) in LS neurons is required for social novelty recognition. To better understand molecular mechanisms by which TrkB signaling controls behavior, we locally knocked down TrkB in LS and used bulk RNA-sequencing to identify changes in gene expression downstream of TrkB. TrkB knockdown induces upregulation of genes associated with inflammation and immune responses, and downregulation of genes associated with synaptic signaling and plasticity. Next, we generated one of the first atlases of molecular profiles for LS cell types using single nucleus RNA-sequencing (snRNA-seq). We identified markers for the septum broadly, and the LS specifically, as well as for all neuronal cell types. We then investigated whether the differentially expressed genes (DEGs) induced by TrkB knockdown map to specific LS cell types. Enrichment testing identified that downregulated DEGs are broadly expressed across neuronal clusters. Enrichment analyses of these DEGs demonstrated that downregulated genes are uniquely expressed in the LS, and associated with either synaptic plasticity or neurodevelopmental disorders. Upregulated genes are enriched in LS microglia, associated with immune response and inflammation, and linked to both neurodegenerative disease and neuropsychiatric disorders. In addition, many of these genes are implicated in regulating social behaviors. In summary, the findings implicate TrkB signaling in the LS as a critical regulator of gene networks associated with psychiatric disorders that display social deficits, including schizophrenia and autism, and with neurodegenerative diseases, including Alzheimer’s.","The nucleus accumbens (NAc) is a key component of the mesolimbic dopamine system that is implicated in several neuropsychiatric disorders. The NAc contains transcriptomically distinct medium spiny neuron (MSN) subtypes, but their spatial organization remains unclear. We generated a spatiomolecular atlas of the human NAc by integrating paired single-cell and spatial transcriptomics of postmortem NAc tissue. We identified transcriptionally unique cell populations and spatial domains (SpDs), including D1 islands composed of discrete MSN subtypes enriched for dopamine receptor D1 (DRD1) and OPRM1. We demonstrated continuous spatial gene expression gradients across the NAc and evolutionary conservation of spatial features. We also identified SpDs associated with risk for psychiatric and addiction-related traits and spatially mapped risk-associated ligand-receptor interactions. Finally, we predicted enrichment of drug-responsive transcriptional programs in both SpDs and cell types. Collectively, we provide a spatiomolecular framework for understanding the relevance of the human NAc in neuropsychiatric diseases.","We used the 10x Genomics Visium platform to define the spatial topography of gene expression in the six-layered human dorsolateral prefrontal cortex (DLPFC). We identified extensive layer-enriched expression signatures, and refined associations to previous laminar markers. We overlaid our laminar expression signatures onto large-scale single nuclei RNA sequencing data, enhancing spatial annotation of expression-driven clusters. By integrating neuropsychiatric disorder gene sets, we showed differential layer-enriched expression of genes associated with schizophrenia and autism spectrum disorder, highlighting the clinical relevance of spatially-defined expression. We then developed a data-driven framework to define unsupervised clusters in spatial transcriptomics data, which can be applied to other tissues or brain regions where morphological architecture is not as well-defined as cortical laminae. We lastly created a web application for the scientific community to explore these raw and summarized data to augment ongoing neuroscience and spatial transcriptomics research.","Single-cell gene expression technologies are powerful tools to study cell types in the human brain, but efforts have largely focused on cortical brain regions. We therefore created a single-nucleus RNA-sequencing resource of 70,615 high-quality nuclei to generate a molecular taxonomy of cell types across five human brain regions that serve as key nodes of the human brain reward circuitry: nucleus accumbens, amygdala, subgenual anterior cingulate cortex, hippocampus, and dorsolateral prefrontal cortex. We first identified novel subpopulations of interneurons and medium spiny neurons (MSNs) in the nucleus accumbens and further characterized robust GABAergic inhibitory cell populations in the amygdala. Joint analyses across the 107 reported cell classes revealed cell-type substructure and unique patterns of transcriptomic dynamics. We identified discrete subpopulations of D1- and D2-expressing MSNs in the nucleus accumbens to which we mapped cell-type-specific enrichment for genetic risk associated with both psychiatric disease and addiction."],"DOI_Group":["10.1186/s12864-024-10991-y","10.1126/sciadv.adw1029","10.1101/2025.07.14.664821","10.1016/j.celrep.2025.115300","10.1126/science.adh1938","10.64898/2026.02.16.706214","10.1101/2025.11.20.689483 ","10.1038/s41593-025-02022-0","10.1016/j.celrep.2025.116877","10.1101/2025.10.29.685354","10.1038/s41398-024-02758-6","10.1101/2025.09.10.675374 ","10.1038/s41593-020-00787-0","10.1016/j.neuron.2021.09.001"],"github_group":["visiumStitched_brain","BLA_crossSpecies","spatialdACC","spatial_DG_lifespan","spatialDLPFC","spatialDLPFC_SCZ","LFF_spatial_ERC","spatial_hpc","spatial_HYP","LFF_spatial_LC","septum_lateral","spatial_NAc","spatialLIBD","10xPilot_snRNAseq-human"],"search_helper":["Nicholas J. Eagles, Svitlana V. Bach, Madhavi Tippani, Prashanthi Ravichandran, Yufeng Du, Ryan A. Miller, Thomas M. Hyde, Stephanie C. Page, Keri Martinowich & Leonardo Collado-Torres visiumStitched provides a simple, but flexible framework to handle various multi-capture area study design scenarios. Specifically, it resolves a data processing step without disrupting analysis workflows and without discarding data from overlapping spots. visiumStitched relies on affine transformations by Fiji, which have limitations and are less accurate when aligning against an atlas or other situations. visiumStitched provides an easy-to-use solution which expands possibilities for designing multi-capture area study designs. 10.1186/s12864-024-10991-y visiumStitched_brain","Michael S. Totty, Rita Cervera Juanes, Svitlana V. Bach, Lamya Ben Ameur, Madeline R. Valentine, Evan Simons, McKenna D. Romac, Hoa Trinh, Krystal Henderson, Ishbel Del Rosario, Madhavi Tippani, Ryan A. Miller, Joel E. Kleinman, Stephanie Cerceo Page, Arpiar Saunders, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Vincent D. Costa The amygdaloid complex mediates learning, memory, and emotions. Understanding cellular and anatomical features specialized in the primate amygdala versus other mammals requires a systematic, anatomically resolved molecular analysis of neuron types. We analyzed five nuclear subdivisions of the primate amygdala with single-nucleus RNA sequencing in macaques, baboons, and humans to examine gene expression profiles for excitatory and inhibitory neurons. Integrated analyses across species identified diverse subtypes of glutamatergic and GABAergic neurons that are highly conserved across primates. Compositional analyses revealed that subdivisions of the primate basolateral complex contain distinct classes of glutamatergic neurons and divergent gene expression profiles for parvalbumin and somatostatin GABAergic neurons. Referencing primate neuron types to transcriptomic atlases of the murine amygdala highlighted primate-specific specializations for glutamatergic neurons and identified which neuron types are conserved across mammals and amygdalar subdivisions. Understanding the molecular heterogeneity of anatomically resolved amygdalar neuron types provides a cellular framework for improving models of how amygdalar circuits contribute to cognition and mental health. 10.1126/sciadv.adw1029 BLA_crossSpecies","Kinnary Shah, Michael S. Totty, Svitlana V. Bach, Madeline R. Valentine, Atharv Chandra, Heena R. Divecha, Ryan A. Miller, Sang Ho Kwon, Anthony D. Ramnauth, Madhavi Tippani, Sanjana Tyagi, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Thomas M. Hyde, Stephanie C. Page, Kristen R. Maynard, Stephanie C. Hicks, Keri Martinowich In the human brain, the dorsal anterior cingulate cortex (dACC) plays key roles in various components of cognitive control, and is particularly relevant for reward processing and conflict monitoring. The dACC regulates expression of fear and pain, and its dysfunction is implicated in a number of neuropsychiatric disorders. Compared to more recently specialized neocortical areas, such as the dorsolateral prefrontal cortex (dlPFC), the dACC is evolutionarily older. The region’s agranular structure, and other evolutionary specializations, such as the presence of von Economo neurons (VENs), contribute to its specialized roles in cognitive and emotional processing. Here, we generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from adjacent tissue sections of the dACC in ten adult neurotypical donors to define molecular profiles for dACC cell types and spatial domains. Using non-negative matrix factorization (NMF), we integrated these data by identifying gene expression patterns within the snRNA-seq data, which were projected onto the SRT data to infer the spatial localization. Combining these data with publicly available resources, we revealed insights about molecular profiles, spatial topography, enrichment of disease risk, and putative connectivity of spatially-localized dACC cell types, including VENs. Utilizing published dlPFC snRNA-seq and SRT data collected in the same neurotypical brain donors used here, we deployed cross-region comparison analyses between dACC and dlPFC to understand spatio-molecular specializations and laminar organization across human brain evolution. To make this comprehensive molecular resource accessible to the scientific community, we made both raw and processed data freely available, including through interactive web applications. 10.1101/2025.07.14.664821 spatialdACC","Anthony D. Ramnauth, Madhavi Tippani, Heena R. Divecha, Alexis R. Papariello, Ryan A. Miller,  Erik D. Nelson, Jacqueline R. Thompson, Elizabeth A. Pattie, Joel E. Kleinman, Kristen R. Maynard, Leonardo Collado-Torres, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Stephanie C. Page The dentate gyrus of the hippocampus is important for many cognitive functions, including learning, memory, and mood. Here, we present transcriptome-wide spatial gene expression maps of the human dentate gyrus and investigate age-associated changes across the lifespan. Genes associated with neurogenesis and the extracellular matrix are enriched in infants and decline throughout development and maturation. Following infancy, inhibitory neuron markers increase, and cellular proliferation markers decrease. We also identify spatio-molecular signatures that support existing evidence for protracted maturation of granule cells during adulthood and age-associated increases in neuroinflammation-related gene expression. Our findings support the notion that the hippocampal neurogenic niche undergoes major changes following infancy and identify molecular regulators of brain aging in glial- and neuropil-enriched tissue. 10.1016/j.celrep.2025.115300 spatial_DG_lifespan","Louise A Huuki-Myers, Abby Spangler , Nicholas J Eagles , Kelsey D Montgomery , Sang Ho Kwon , Boyi Guo, Melissa Grant-Peters, Heena R Divecha, Madhavi Tippani, Chaichontat Sriworarat, Annie B Nguyen , Prashanthi Ravichandran, Matthew N Tran, Arta Seyedian; PsychENCODE Consortium; Thomas M Hyde, Joel E Kleinman, Alexis Battle, Stephanie C Page, Mina Ryten , Stephanie C Hicks, Keri Martinowich, Leonardo Collado-Torres , Kristen R Maynard The molecular organization of the human neocortex historically has been studied in the context of its histological layers. However, emerging spatial transcriptomic technologies have enabled unbiased identification of transcriptionally defined spatial domains that move beyond classic cytoarchitecture. We used the Visium spatial gene expression platform to generate a data-driven molecular neuroanatomical atlas across the anterior-posterior axis of the human dorsolateral prefrontal cortex. Integration with paired single-nucleus RNA-sequencing data revealed distinct cell type compositions and cell-cell interactions across spatial domains. Using PsychENCODE and publicly available data, we mapped the enrichment of cell types and genes associated with neuropsychiatric disorders to discrete spatial domains. 10.1126/science.adh1938 spatialDLPFC","Sang Ho Kwon, Boyi Guo, Cindy Fang, Madhavi Tippani, Svitlana V. Bach, Ryan A. Miller, Sarah E. Maguire, Artemis Iatrou, Geo Pertea, Nicholas J. Eagles, Madeline R. Valentine, Seyun Oh, Aarti Jajoo, Vijetha Balakundi, Yufeng Du, Annie B. Nguyen, Ruth Zhang, Uma M. Kaipa, Heena R. Divecha, Jashandeep S. Lobana, Joel E. Kleinman, Shizhong Han, Nikolaos P. Daskalakis, Thomas M. Hyde, Leonardo Collado-Torres, Stephanie C. Page, Kristen R. Maynard, Stephanie C. Hicks, Keri Martinowich The dorsolateral prefrontal cortex (dlPFC) is central to cognitive dysfunction in schizophrenia (SCZ), yet how molecular changes are organized across cortex remains unclear. Here, we applied complementary spatial transcriptomic approaches spanning laminar domains, microenvironments, and cell types in postmortem human dlPFC. At the laminar level, SCZ-associated transcriptional changes were strongest in glia-enriched domains (layer 1/meninges and white matter), including down-regulation of microglia-associated genes, whereas genetic risk localized to neuronal-rich gray matter. We next analyzed SCZ-linked microenvironments including neuropil, neuronal, perineuronal net, and vascular compartments. Within these, neuronal and synaptic transcriptional changes were most prominent in neuropil, showing down-regulation of activity-dependent synaptic genes and inhibitory neuron markers. At the cellular level, these signals reflected intrinsic alterations localized to cell types. Across analyses, patterns converged on altered BDNF-TrkB signaling and inhibitory circuit dysfunction. Together, our findings highlight spatial scale as a key determinant in resolving neuronal and non-neuronal aspects of SCZ-associated biology. 10.64898/2026.02.16.706214 spatialDLPFC_SCZ","Louise A. Huuki-Myers, Heena R. Divecha, Svitlana V. Bach, Madeline R. Valentine, Nicholas J. Eagles, Bernard Mulvey, Rahul A. Bharadwaj, Ruth Zhang, James R. Evans, Melissa Grant-Peters, Ryan A. Miller, Joel E. Kleinman, Shizhong Han, Thomas M. Hyde, Stephanie C. Page, Daniel R. Weinberger, Keri Martinowich, Mina Ryten, Kristen R. Maynard, Leonardo Collado-Torres The entorhinal cortex (ERC) is implicated in early progression of Alzheimer’s disease (AD). Here we investigated the impact of established biological risk factors for AD, including APOE genotype (E2 versus E4 alleles), sex, and ancestry, on gene expression in the human ERC. We generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA sequencing data (snRNA-seq) in postmortem human ERC tissue from middle aged brain donors with no history of AD. APOE-dependent changes in gene expression predominantly mapped to a transcriptionally-defined oligodendrocyte subtype, which varied substantially with ancestry, and suggested differences in oligodendrocyte differentiation and myelination. Integration of SRT and snRNA-seq data identified a common gene expression signature associated with APOE genotype, which we localized to the same oligodendrocyte subtype and a white matter spatial domain. This suggests that AD risk in ERC may be associated with disrupted oligodendrocyte function, potentially contributing to future neurodegeneration. 10.1101/2025.11.20.689483  LFF_spatial_ERC","Jacqueline R. Thompson, Erik D. Nelson, Madhavi Tippani, Anthony D. Ramnauth, Heena R. Divecha, Ryan A. Miller, Nicholas J. Eagles, Elizabeth A. Pattie, Sang Ho Kwon, Svitlana V. Bach, Uma M. Kaipa, Jianing Yao, Christine Hou, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Kristen R. Maynard, Thomas M. Hyde, Keri Martinowich, Stephanie C. Page & Stephanie C. Hicks  Cell types in the hippocampus with unique morphology, physiology and connectivity serve specialized functions associated with cognition and mood. These cell types are spatially organized, necessitating molecular profiling strategies that retain cytoarchitectural organization. Here we generated spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from anterior human hippocampus in ten adult neurotypical donors. Using non-negative matrix factorization (NMF) and label transfer, we integrated these data by defining gene expression patterns within the snRNA-seq data and then inferring expression in the SRT data. These patterns captured transcriptional variation across neuronal cell types and indicated spatial organization of excitatory and inhibitory postsynaptic specializations. Leveraging the NMF and label transfer approach with rodent datasets, we identified putative patterns of activity-dependent transcription and circuit connectivity in the human SRT dataset. Finally, we characterized the spatial organization of NMF patterns corresponding to pyramidal neurons and identified regionally-specific snRNA-seq clusters of the retrohippocampus, subiculum and presubiculum. To make this molecular atlas widely accessible, raw and processed data are freely available, including through interactive web applications. 10.1038/s41593-025-02022-0 spatial_hpc","Bernard Mulvey, Yi Wang, Heena R. Divecha, Svitlana V. Bach, Kelsey D. Montgomery, Sophia Cinquemani, Atharv Chandra, Yufeng Du, Ryan A. Miller, Joel E. Kleinman, Stephanie C. Page, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Kasper D. Hansen, Kristen R. Maynard The hypothalamus contains multiple regions, including the ventromedial hypothalamus (VMH) and arcuate (ARC), which are responsible for sex-differentiated functions such as endocrine signaling, metabolism, and reproductive behaviors. While molecular, anatomic, and sex-differentiated features of the rodent hypothalamus are well established, much less is known about these regions in humans. Here, we provide a spatially resolved single-cell atlas of sex-differentially expressed (sex-DE) genes in the human ARC and VMH. We identify neuronal populations governing hypothalamus-specific functions, define their spatial distributions, and show enrichment of sex-DE in retinoid metabolism- and retinoid receptor-regulated genes. Within the ARC and VMH, we find correlated autosomal expression differences localized to ESR1/TAC3-expressing and corticotropin-releasing hormone receptor 2 (CRHR2)-expressing neurons and extensive sex-DE genes linked to sex-biased disorders, including autism, depression, and schizophrenia. Our molecular mapping of disease associations to hypothalamic cell types with established roles in sex-divergent physiology and behavior provides insights into the mechanistic bases of sex bias in neurodevelopmental and neuropsychiatric disorders. 10.1016/j.celrep.2025.116877 spatial_HYP","Bernard Mulvey, Heena R. Divecha, Madhavi Tippani, Svitlana V. Bach, Rahul Bharadwaj, Ishbel Del Rosario, Sarah E. Maguire, Ryan A. Miller, Aaron J. Salisbury, Atharv Chandra, Beau A. Oster, Kelsey D. Montgomery, Sang Ho Kwon, Haya A. Algrain, Alexis R. Papariello, Louise A. Huuki-Myers, Joel E. Kleinman, Leonardo Collado-Torres, Thomas M. Hyde, Shizhong Han, Stephanie C. Hicks, Daniel R. Weinberger, Stephanie C. Page, Kristen R. Maynard, Keri Martinowich The locus coeruleus (LC) is a small noradrenergic nucleus in the dorsal pons that sends projections across the brain regulating sleep, arousal, attention, stress responses, and some forms of cognition. LC neurons show pathology in the earliest stages of Alzheimer’s disease (AD), including age-related accumulation of hyperphosphorylated tau (pTau) and accelerated loss of neuromelanin (NM) pigmentation. NM-sensitive neuroimaging of the LC predicts previous cognitive decline, clinical severity, and future AD progression. While these findings suggest that the LC plays an etiologic role in AD, the molecular landscape of the LC prior to clinical manifestation of sporadic AD remains largely uncharacterized. This information is critical for developing interventions that preserve LC integrity and function. We performed spatially-resolved transcriptomics on 85 sections of human postmortem LC from N=33 neurotypical middle-aged donors, balanced for epidemiologic AD risk factors including sex, African or European ancestry, and APOE genotype (carriers of the E4/risk or E2/protective alleles). Comparing across APOE genotypes, we find astrocytic gene expression differences proximal to LC neurons. Associating NM content with local gene expression, we show that higher overall APOE gene expression correlates with reduced NM content and an enrichment of NM-associated genes in aging pathways. Unexpectedly, we find enriched LC expression of cholesterol synthesis genes, alongside evidence for lipid synthesis gene regulatory network activity in NM-containing LC specifically, revealing a potential intersection between intrinsic lipid metabolism in LC neurons, NM, and the role of APOE-mediated lipid biology in AD. Together, these data illuminate the molecular features of the human LC at spatial resolution with unprecedented sampling depth, revealing how AD risk factors and NM content influence resilience and susceptibility of this critical brain nucleus to pathology accumulation and degeneration. 10.1101/2025.10.29.685354 LFF_spatial_LC","Lionel A. Rodriguez, Matthew Nguyen Tran, Renee Garcia-Flores, Seyun Oh, Robert A. Phillips III, Elizabeth A. Pattie, Heena R. Divecha, Sun Hong Kim, Joo Heon Shin, Yong Kyu Lee, Carly Montoya, Andrew E. Jaffe, Leonardo Collado-Torres, Stephanie C. Page & Keri Martinowich  The lateral septum (LS), a GABAergic structure located in the basal forebrain, is implicated in social behavior, learning, and memory. We previously demonstrated that expression of tropomyosin kinase receptor B (TrkB) in LS neurons is required for social novelty recognition. To better understand molecular mechanisms by which TrkB signaling controls behavior, we locally knocked down TrkB in LS and used bulk RNA-sequencing to identify changes in gene expression downstream of TrkB. TrkB knockdown induces upregulation of genes associated with inflammation and immune responses, and downregulation of genes associated with synaptic signaling and plasticity. Next, we generated one of the first atlases of molecular profiles for LS cell types using single nucleus RNA-sequencing (snRNA-seq). We identified markers for the septum broadly, and the LS specifically, as well as for all neuronal cell types. We then investigated whether the differentially expressed genes (DEGs) induced by TrkB knockdown map to specific LS cell types. Enrichment testing identified that downregulated DEGs are broadly expressed across neuronal clusters. Enrichment analyses of these DEGs demonstrated that downregulated genes are uniquely expressed in the LS, and associated with either synaptic plasticity or neurodevelopmental disorders. Upregulated genes are enriched in LS microglia, associated with immune response and inflammation, and linked to both neurodegenerative disease and neuropsychiatric disorders. In addition, many of these genes are implicated in regulating social behaviors. In summary, the findings implicate TrkB signaling in the LS as a critical regulator of gene networks associated with psychiatric disorders that display social deficits, including schizophrenia and autism, and with neurodegenerative diseases, including Alzheimer’s. 10.1038/s41398-024-02758-6 septum_lateral","Prashanthi Ravichandran, Svitlana V. Bach, Robert A. ealed cell-type substructure and unique patterns of transcriptomic dynamics. We identified discrete subpopulations of D1- and D2-expressing MSNs in the nucleus accumbens to which we mapped cell-type-specific enrichment for genetic risk associated with both psychiatric disease and addiction. 10.1016/j.neuron.2021.09.001 10xPilot_snRNAseq-human"],"nested_records":[{"Region":["Cortex"],"FullTitle":["Integrating gene expression and imaging data across Visium capture areas with visiumStitched"],"project_id":["VisStitch2025"],"Title1":["VisiumStitched_brain"],"Authors":["Nicholas J. Eagles, Svitlana V. Bach, Madhavi Tippani, Prashanthi Ravichandran, Yufeng Du, Ryan A. Miller, Thomas M. Hyde, Stephanie C. Page, Keri Martinowich & Leonardo Collado-Torres"],"Year":[2025],"Summary":["visiumStitched provides a simple, but flexible framework to handle various multi-capture area study design scenarios. Specifically, it resolves a data processing step without disrupting analysis workflows and without discarding data from overlapping spots. visiumStitched relies on affine transformations by Fiji, which have limitations and are less accurate when aligning against an atlas or other situations. visiumStitched provides an easy-to-use solution which expands possibilities for designing multi-capture area study designs."],"DOI":["10.1186/s12864-024-10991-y"],"Link2App":["https://interactive.libd.org/visiumStitched_brain/"],"GitHub":["visiumStitched_brain"],"dataType":["spatial"],"dx":["neurotypical"],"species":["Human"],"AppType":["spatialLIBD"]},{"Region":["BLA","BLA","BLA"],"FullTitle":["Transcriptomic diversity of amygdalar subdivisions across humans and nonhuman primates","Transcriptomic diversity of amygdalar subdivisions across humans and nonhuman primates","Transcriptomic diversity of amygdalar subdivisions across humans and nonhuman primates"],"project_id":["bla2025","bla2025","bla2025"],"Title1":["Spatial BLA - Human","Spatial BLA - Baboon","Spatial BLA - Macaque"],"Authors":["M n, Thomas M. Hyde, Stephanie C. Page, Kristen R. Maynard, Stephanie C. Hicks, Keri Martinowich","Kinnary Shah, Michael S. Totty, Svitlana V. Bach, Madeline R. Valentine, Atharv Chandra, Heena R. Divecha, Ryan A. Miller, Sang Ho Kwon, Anthony D. Ramnauth, Madhavi Tippani, Sanjana Tyagi, Joel E. Kleinman, Leonardo Collado-Torres, Shizhong Han, Thomas M. Hyde, Stephanie C. Page, Kristen R. Maynard, Stephanie C. Hicks, Keri Martinowich"],"Year":[2026,2026],"Summary":["In the human brain, the dorsal anterior cingulate cortex (dACC) plays key roles in various components of cognitive control, and is particularly relevant for reward processing and conflict monitoring. The dACC regulates expression of fear and pain, and its dysfunction is implicated in a number of neuropsychiatric disorders. Compared to more recently specialized neocortical areas, such as the dorsolateral prefrontal cortex (dlPFC), the dACC is evolutionarily older. The region’s agranular structure, and other evolutionary specializations, such as the presence of von Economo neurons (VENs), contribute to its specialized roles in cognitive and emotional processing. Here, we generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from adjacent tissue sections of the dACC in ten adult neurotypical donors to define molecular profiles for dACC cell types and spatial domains. Using non-negative matrix factorization (NMF), we integrated these data by identifying gene expression patterns within the snRNA-seq data, which were projected onto the SRT data to infer the spatial localization. Combining these data with publicly available resources, we revealed insights about molecular profiles, spatial topography, enrichment of disease risk, and putative connectivity of spatially-localized dACC cell types, including VENs. Utilizing published dlPFC snRNA-seq and SRT data collected in the same neurotypical brain donors used here, we deployed cross-region comparison analyses between dACC and dlPFC to understand spatio-molecular specializations and laminar organization across human brain evolution. To make this comprehensive molecular resource accessible to the scientific community, we made both raw and processed data freely available, including through interactive web applications.","In the human brain, the dorsal anterior cingulate cortex (dACC) plays key roles in various components of cognitive control, and is particularly relevant for reward processing and conflict monitoring. The dACC regulates expression of fear and pain, and its dysfunction is implicated in a number of neuropsychiatric disorders. Compared to more recently specialized neocortical areas, such as the dorsolateral prefrontal cortex (dlPFC), the dACC is evolutionarily older. The region’s agranular structure, and other evolutionary specializations, such as the presence of von Economo neurons (VENs), contribute to its specialized roles in cognitive and emotional processing. Here, we generated paired spatially-resolved transcriptomics (SRT) and single-nucleus RNA-sequencing (snRNA-seq) data from adjacent tissue sections of the dACC in ten adult neurotypical donors to define molecular profiles for dACC cell types and spatial domains. Using non-negative matrix factorization (NMF), we integrated these data by identifying gene expression patterns within the snRNA-seq data, which were projected onto the SRT data to infer the spatial localization. Combining these data with publicly available resources, we revealed insights about molecular profiles, spatial topography, enrichment of disease risk, and putative connectivity of spatially-localized dACC cell types, including VENs. Utilizing published dlPFC snRNA-seq and SRT data collected in the same neurotypical brain donors used here, we deployed cross-region comparison analyses between dACC and dlPFC to understand spatio-molecular specializations and laminar organization across human brain evolution. To make this comprehensive molecular resource accessible to the scientific community, we made both raw and processed data freely available, including through interactive web applications."],"DOI":["10.1101/2025.07.14.664821","10.1101/2025.07.14.664821"],"Link2App":["https://interactive.libd.org/spatialdACC_Visium/","https://interactive.libd.org/snRNAseq_dACC/"],"GitHub":["spatialdACC","spatialdACC"],"dataType":["spatial","snRNA-seq"],"dx":["neurotypical","neurotypical"],"species":["Human","Human"],"AppType":["spatialLIBD","iSEE"]},{"Region":["DG"],"FullTitle":["Spatiotemporal analysis of gene expression in the human dentate gyrus reveals age-associated changes in cellular maturation and neuroinflammation"],"project_id":["dg2025"],"Title1":["Spatial DG"],"Authors":["Anthony D. Ramnauth, Madhavi Tippani, Heena R. Divecha, Alexis R. Papariello, Ryan A. Miller,  Erik D. Nelson, Jacqueline R. Thompson, Elizabeth A. Pattie, Joel E. Kleinman, Kristen R. Maynard, Leonardo Collado-Torres, Thomas M. Hyde, Keri Martinowich, Stephanie C. Hicks, Stephanie C. Page"],"Year":[2025],"Summary":["The dentate gyrus of the hippocampus is important for many cognitive functions, including learning, memory, and mood. Here, we present transcriptome-wide spatial gene expression maps of the human dentate gyrus and investigate age-associated changes across the lifespan. Genes associated with neurogenesis and the extracellular matrix are enriched in infants and decline throughout development and maturation. Following infancy, inhibitory neuron markers increase, and cellular proliferation markers decrease. We also identify spatio-molecular signatures that support existing evidence for protracted maturation of granule cells during adulthood and age-associated increases in neuroinflammation-related gene expression. Our findings support the notion that the hippocampal neurogenic niche undergoes major changes following infancy and identify molecular regulators of brain aging in glial- and neuropil-enriched tissue."],"DOI":["10.
